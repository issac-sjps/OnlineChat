<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ── RESET & VARIABLES ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080c14;
  --bg2: #0d1320;
  --bg3: #111827;
  --border: rgba(255,255,255,0.07);
  --accent: #22d3ee;
  --accent2: #818cf8;
  --danger: #f87171;
  --text: #e2e8f0;
  --muted: #64748b;
  --online: #34d399;
  --msg-self: #1e3a5f;
  --msg-other: #1a1f2e;
  --panel-w: 240px;
  --dm-w: 320px;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── LOADING SCREEN ── */
#loading-screen {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  transition: opacity 0.5s;
}
#loading-screen.hide { opacity: 0; pointer-events: none; }
.loader-logo {
  font-family: 'Syne', sans-serif;
  font-size: 2.5rem; font-weight: 800;
  letter-spacing: -2px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.loader-bar {
  width: 200px; height: 2px;
  background: var(--border);
  border-radius: 99px; overflow: hidden;
}
.loader-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  animation: load 1.5s ease-in-out forwards;
}
@keyframes load { from { width: 0; } to { width: 100%; } }

/* ── NICKNAME MODAL ── */
#nick-modal {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
}
#nick-modal.hide { display: none; }
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  width: 340px;
  box-shadow: 0 0 60px rgba(34,211,238,0.08);
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem; font-weight: 700;
  margin-bottom: 6px;
}
.modal-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
.modal-input {
  width: 100%; padding: 10px 14px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 0.95rem; font-family: inherit;
  outline: none; transition: border-color 0.2s;
  margin-bottom: 12px;
}
.modal-input:focus { border-color: var(--accent); }
.btn-enter {
  width: 100%; padding: 10px;
  background: var(--accent); color: #000;
  font-weight: 700; font-family: 'Syne', sans-serif;
  font-size: 0.95rem; letter-spacing: 0.5px;
  border: none; border-radius: 8px;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-enter:hover { opacity: 0.85; }

/* ── APP SHELL ── */
#app { display: flex; height: 100vh; }

/* ── LEFT PANEL ── */
#panel-left {
  width: var(--panel-w);
  min-width: var(--panel-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.panel-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 1.1rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.panel-section {
  padding: 10px 14px 4px;
  font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase;
}
.user-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.user-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px; border-radius: 8px;
  cursor: pointer; transition: background 0.15s;
  position: relative;
}
.user-item:hover { background: rgba(255,255,255,0.04); }
.user-item.active { background: rgba(34,211,238,0.08); }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  position: relative;
}
.avatar-dot {
  position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px;
  background: var(--online); border-radius: 50%;
  border: 2px solid var(--bg2);
}
.user-name {
  font-size: 0.85rem; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-name.you { color: var(--accent); }
.dm-badge {
  margin-left: auto; background: var(--accent);
  color: #000; font-size: 0.65rem; font-weight: 700;
  padding: 1px 6px; border-radius: 99px; min-width: 18px;
  text-align: center; display: none;
}
.dm-badge.show { display: block; }
.my-info {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.my-name { font-size: 0.85rem; font-weight: 500; }
.my-status { font-size: 0.72rem; color: var(--online); }

/* ── MAIN CHAT ── */
#main-chat {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
}
.chat-topbar {
  padding: 0 20px;
  height: 56px; min-height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.chat-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 1rem;
}
.online-count {
  font-size: 0.8rem; color: var(--muted);
}
.online-count span { color: var(--online); font-weight: 600; }

.messages {
  flex: 1; overflow-y: auto;
  padding: 16px 20px;
  display: flex; flex-direction: column; gap: 4px;
}
.msg-group { margin-bottom: 8px; }
.msg-meta {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 3px; padding: 0 2px;
}
.msg-author {
  font-size: 0.8rem; font-weight: 600;
}
.msg-time {
  font-size: 0.7rem; color: var(--muted);
}
.msg-bubble {
  display: inline-block;
  padding: 8px 12px; border-radius: 10px;
  font-size: 0.88rem; line-height: 1.55;
  max-width: 100%; word-break: break-word;
  background: var(--msg-other);
}
.msg-row.self .msg-meta { flex-direction: row-reverse; }
.msg-row.self .msg-bubble {
  background: var(--msg-self);
  border-bottom-right-radius: 3px;
}
.msg-row .msg-bubble { border-bottom-left-radius: 3px; }
.msg-row { display: flex; flex-direction: column; }
.msg-row.self { align-items: flex-end; }

/* System messages */
.msg-system {
  text-align: center; font-size: 0.75rem;
  color: var(--muted); padding: 4px 0;
}

.chat-input-bar {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
}
.chat-input {
  flex: 1; padding: 10px 14px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 0.9rem; font-family: inherit;
  outline: none; transition: border-color 0.2s;
  resize: none; max-height: 120px;
}
.chat-input:focus { border-color: var(--accent); }
.btn-send {
  padding: 0 18px; height: 40px;
  background: var(--accent); color: #000;
  font-weight: 700; font-size: 0.85rem;
  font-family: 'Syne', sans-serif;
  border: none; border-radius: 8px;
  cursor: pointer; transition: opacity 0.2s;
  white-space: nowrap;
}
.btn-send:hover { opacity: 0.85; }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── DM PANEL ── */
#panel-dm {
  width: var(--dm-w);
  min-width: var(--dm-w);
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
#panel-dm.open { transform: translateX(0); }

.dm-topbar {
  padding: 0 16px;
  height: 56px; min-height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.dm-with {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 0.95rem;
}
.dm-with span { color: var(--accent); }
.btn-close-dm {
  background: none; border: none;
  color: var(--muted); cursor: pointer; font-size: 1.1rem;
  padding: 4px; border-radius: 4px;
  transition: color 0.2s;
}
.btn-close-dm:hover { color: var(--text); }

.dm-messages {
  flex: 1; overflow-y: auto;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px;
}

.dm-input-area {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.dm-file-row {
  display: flex; align-items: center; gap: 8px;
}
.btn-file {
  padding: 7px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; color: var(--muted);
  font-size: 0.8rem; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.btn-file:hover { border-color: var(--accent2); color: var(--accent2); }
#dm-file-input { display: none; }
.file-preview {
  font-size: 0.75rem; color: var(--accent2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.dm-msg-row {
  display: flex; align-items: center; gap: 6px;
}
.dm-input {
  flex: 1; padding: 8px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-size: 0.85rem; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.dm-input:focus { border-color: var(--accent); }
.btn-dm-send {
  padding: 0 14px; height: 36px;
  background: var(--accent2); color: #fff;
  font-weight: 700; font-size: 0.8rem;
  font-family: 'Syne', sans-serif;
  border: none; border-radius: 7px;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-dm-send:hover { opacity: 0.85; }
.btn-dm-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* File message */
.file-msg {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  max-width: 220px;
}
.file-icon { font-size: 1.3rem; }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-dl { font-size: 0.72rem; color: var(--accent); cursor: pointer; }
.file-dl:hover { text-decoration: underline; }

/* Upload progress */
.upload-bar {
  height: 2px; background: var(--border); border-radius: 99px; overflow: hidden;
  margin-top: 4px;
}
.upload-fill {
  height: 100%; background: var(--accent2);
  border-radius: 99px; transition: width 0.2s;
}

/* ── NOTIFICATION TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--bg2); border: 1px solid var(--border);
  padding: 10px 18px; border-radius: 8px;
  font-size: 0.85rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── MOBILE OVERLAY ── */
@media (max-width: 768px) {
  #panel-left {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 50;
    transform: translateX(-100%); transition: transform 0.3s;
  }
  #panel-left.mob-open { transform: translateX(0); }
  #panel-dm {
    position: fixed; right: 0; top: 0; bottom: 0; z-index: 50;
  }
  .hamburger { display: flex !important; }
}
.hamburger {
  display: none; flex-direction: column; gap: 4px;
  background: none; border: none; cursor: pointer; padding: 4px;
}
.hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }

/* Typing indicator */
.typing-indicator {
  font-size: 0.75rem; color: var(--muted);
  padding: 2px 20px; min-height: 20px;
  font-style: italic;
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loader-logo">ChatRoom</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div style="font-size:0.8rem;color:var(--muted)">連線中...</div>
</div>

<!-- Nickname Modal -->
<div id="nick-modal" class="hide">
  <div class="modal-box">
    <div class="modal-title">👋 歡迎加入</div>
    <div class="modal-sub">請輸入你的暱稱，其他人會看到這個名字</div>
    <input class="modal-input" id="nick-input" type="text" placeholder="你的暱稱" maxlength="20" autocomplete="off">
    <button class="btn-enter" id="nick-btn">進入聊天室 →</button>
  </div>
</div>

<!-- App -->
<div id="app">

  <!-- Left Panel -->
  <div id="panel-left">
    <div class="panel-header">
      <div class="panel-logo">ChatRoom</div>
    </div>
    <div class="panel-section">在線用戶 (<span id="online-count">0</span>)</div>
    <div class="user-list" id="user-list"></div>
    <div class="my-info">
      <div class="user-avatar" id="my-avatar" style="background:#1e3a5f"></div>
      <div>
        <div class="my-name" id="my-name-display">—</div>
        <div class="my-status">● 在線</div>
      </div>
    </div>
  </div>

  <!-- Main Chat -->
  <div id="main-chat">
    <div class="chat-topbar">
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
      <div class="chat-title"># 大廳</div>
      <div class="online-count"><span id="topbar-count">0</span> 人在線</div>
    </div>
    <div class="messages" id="global-messages"></div>
    <div class="typing-indicator" id="global-typing"></div>
    <div class="chat-input-bar">
      <textarea class="chat-input" id="global-input" placeholder="輸入訊息…" rows="1"></textarea>
      <button class="btn-send" id="global-send">送出</button>
    </div>
  </div>

  <!-- DM Panel -->
  <div id="panel-dm">
    <div class="dm-topbar">
      <div class="dm-with">私訊：<span id="dm-with-name">—</span></div>
      <button class="btn-close-dm" id="close-dm">✕</button>
    </div>
    <div class="dm-messages" id="dm-messages"></div>
    <div class="dm-input-area">
      <div class="dm-file-row">
        <button class="btn-file" onclick="document.getElementById('dm-file-input').click()">📎 傳送檔案</button>
        <input type="file" id="dm-file-input">
        <span class="file-preview" id="file-preview-name"></span>
      </div>
      <div id="upload-progress-bar" style="display:none">
        <div class="upload-bar"><div class="upload-fill" id="upload-fill" style="width:0%"></div></div>
      </div>
      <div class="dm-msg-row">
        <input class="dm-input" id="dm-input" type="text" placeholder="私訊…" autocomplete="off">
        <button class="btn-dm-send" id="dm-send">送</button>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ════════════════════════════════════════
     FIREBASE SDK  (compat version)
     ════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

<script>
// ════════════════════════════════════════════════════
//  ⚙️  STEP 1: 填入你的 Firebase 設定
//  到 Firebase Console → 專案設定 → 你的應用程式 → 複製 firebaseConfig
// ════════════════════════════════════════════════════

  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCsjUt0p8q0lV5ThMnAfJva60YkvfP-jlk",
    authDomain: "onlinechat-aa697.firebaseapp.com",
    projectId: "onlinechat-aa697",
    storageBucket: "onlinechat-aa697.firebasestorage.app",
    messagingSenderId: "783019025687",
    appId: "1:783019025687:web:01676384ee6fd544034352",
    measurementId: "G-QTR14CXC41"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);


// ════════════════════════════════════════════════════
//  ⚙️  STEP 2: 設定 (可選)
// ════════════════════════════════════════════════════
const MAX_GLOBAL_MSGS = 100;   // 大廳保留幾則訊息
const MAX_FILE_MB = 10;        // 最大上傳檔案 MB

// ════════════════════════════════════════════════════
//  初始化 Firebase
// ════════════════════════════════════════════════════
firebase.initializeApp(firebaseConfig);
const auth     = firebase.auth();
const db       = firebase.database();
const storage  = firebase.storage();

// ════════════════════════════════════════════════════
//  狀態
// ════════════════════════════════════════════════════
let myUid = null;
let myNick = null;
let dmUid = null;
let dmNick = null;
let dmRoomId = null;
let dmListener = null;
let typingTimer = null;
let selectedFile = null;
const unreadDM = {};
const avatarColors = [
  '#1e3a5f','#1a2e4a','#2d1b69','#1e4036','#3d1a1a',
  '#3d2a0d','#1a3d2b','#2a1a3d','#0d2d3d','#3d1a2d'
];

// ════════════════════════════════════════════════════
//  Utility
// ════════════════════════════════════════════════════
function avatarColor(uid) {
  let h = 0;
  for (let c of uid) h = (h * 31 + c.charCodeAt(0)) & 0xffffff;
  return avatarColors[h % avatarColors.length];
}
function initials(name) {
  return (name || '?').slice(0, 2).toUpperCase();
}
function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function roomId(a, b) {
  return [a, b].sort().join('__');
}
function toast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}
function scrollBottom(el) {
  el.scrollTop = el.scrollHeight;
}
function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
}

// ════════════════════════════════════════════════════
//  AUTH — 匿名登入
// ════════════════════════════════════════════════════
auth.onAuthStateChanged(user => {
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    ls.classList.add('hide');
    setTimeout(() => ls.remove(), 500);

    if (user) {
      myUid = user.uid;
      const savedNick = localStorage.getItem('chatNick_' + myUid);
      if (savedNick) {
        myNick = savedNick;
        enterChat();
      } else {
        showNickModal();
      }
    } else {
      auth.signInAnonymously().catch(err => {
        console.error(err);
        toast('連線失敗，請重新整理');
      });
    }
  }, 1600);
});

function showNickModal() {
  document.getElementById('nick-modal').classList.remove('hide');
  document.getElementById('nick-input').focus();
}

document.getElementById('nick-btn').addEventListener('click', submitNick);
document.getElementById('nick-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitNick();
});

function submitNick() {
  const val = document.getElementById('nick-input').value.trim();
  if (!val) { toast('請輸入暱稱'); return; }
  myNick = val;
  localStorage.setItem('chatNick_' + myUid, myNick);
  document.getElementById('nick-modal').classList.add('hide');
  enterChat();
}

// ════════════════════════════════════════════════════
//  ENTER CHAT
// ════════════════════════════════════════════════════
function enterChat() {
  // my info display
  const myAvEl = document.getElementById('my-avatar');
  myAvEl.textContent = initials(myNick);
  myAvEl.style.background = avatarColor(myUid);
  document.getElementById('my-name-display').textContent = myNick;

  setupPresence();
  listenGlobal();
  listenUsers();
  setupGlobalInput();
}

// ════════════════════════════════════════════════════
//  PRESENCE — 在線列表
// ════════════════════════════════════════════════════
function setupPresence() {
  const presRef = db.ref('presence/' + myUid);
  const connRef = db.ref('.info/connected');

  connRef.on('value', snap => {
    if (!snap.val()) return;
    presRef.onDisconnect().remove();
    presRef.set({ nick: myNick, uid: myUid, ts: firebase.database.ServerValue.TIMESTAMP });
  });
}

function listenUsers() {
  db.ref('presence').on('value', snap => {
    const users = snap.val() || {};
    const list = document.getElementById('user-list');
    list.innerHTML = '';
    let count = 0;

    Object.entries(users).forEach(([uid, info]) => {
      count++;
      const isMe = uid === myUid;
      const div = document.createElement('div');
      div.className = 'user-item' + (uid === dmUid ? ' active' : '');
      div.innerHTML = `
        <div class="user-avatar" style="background:${avatarColor(uid)}">${initials(info.nick)}
          <div class="avatar-dot"></div>
        </div>
        <div class="user-name${isMe ? ' you' : ''}">${info.nick}${isMe ? ' (我)' : ''}</div>
        <div class="dm-badge${(unreadDM[uid] && !isMe) ? ' show' : ''}" id="badge-${uid}">${unreadDM[uid] || ''}</div>
      `;
      if (!isMe) {
        div.addEventListener('click', () => openDM(uid, info.nick));
      }
      list.appendChild(div);
    });

    document.getElementById('online-count').textContent = count;
    document.getElementById('topbar-count').textContent = count;
  });
}

// ════════════════════════════════════════════════════
//  GLOBAL CHAT
// ════════════════════════════════════════════════════
function listenGlobal() {
  const msgContainer = document.getElementById('global-messages');
  db.ref('global/messages').limitToLast(MAX_GLOBAL_MSGS).on('child_added', snap => {
    const msg = snap.val();
    renderGlobalMsg(msg, msgContainer);
    scrollBottom(msgContainer);
  });
}

function renderGlobalMsg(msg, container) {
  if (msg.type === 'system') {
    const div = document.createElement('div');
    div.className = 'msg-system';
    div.textContent = msg.text;
    container.appendChild(div);
    return;
  }
  const isSelf = msg.uid === myUid;
  const div = document.createElement('div');
  div.className = 'msg-row' + (isSelf ? ' self' : '');
  div.innerHTML = `
    <div class="msg-meta">
      <span class="msg-author" style="color:${avatarColor(msg.uid)}">${msg.nick}</span>
      <span class="msg-time">${formatTime(msg.ts)}</span>
    </div>
    <div class="msg-bubble">${escapeHtml(msg.text)}</div>
  `;
  container.appendChild(div);
}

function setupGlobalInput() {
  const input = document.getElementById('global-input');
  const btn = document.getElementById('global-send');

  btn.addEventListener('click', sendGlobal);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendGlobal();
    }
  });
  input.addEventListener('input', () => {
    autoResize(input);
    handleTyping();
  });

  // listen typing
  db.ref('global/typing').on('value', snap => {
    const typingUsers = snap.val() || {};
    const names = Object.entries(typingUsers)
      .filter(([uid, _]) => uid !== myUid)
      .map(([_, name]) => name);
    const el = document.getElementById('global-typing');
    el.textContent = names.length ? names.join(', ') + ' 正在輸入…' : '';
  });
}

function handleTyping() {
  db.ref('global/typing/' + myUid).set(myNick);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    db.ref('global/typing/' + myUid).remove();
  }, 2000);
}

async function sendGlobal() {
  const input = document.getElementById('global-input');
  const text = input.value.trim();
  if (!text) return;

  db.ref('global/typing/' + myUid).remove();
  input.value = '';
  autoResize(input);

  await db.ref('global/messages').push({
    uid: myUid, nick: myNick,
    text, ts: firebase.database.ServerValue.TIMESTAMP
  });

  // trim to MAX_GLOBAL_MSGS
  const snap = await db.ref('global/messages').once('value');
  const msgs = snap.val();
  if (msgs) {
    const keys = Object.keys(msgs);
    if (keys.length > MAX_GLOBAL_MSGS) {
      const toDelete = keys.slice(0, keys.length - MAX_GLOBAL_MSGS);
      const updates = {};
      toDelete.forEach(k => updates['global/messages/' + k] = null);
      db.ref().update(updates);
    }
  }
}

// ════════════════════════════════════════════════════
//  DM (PRIVATE CHAT)
// ════════════════════════════════════════════════════
function openDM(uid, nick) {
  // clean old listener
  if (dmRoomId && dmListener) {
    db.ref('dms/' + dmRoomId + '/messages').off('child_added', dmListener);
  }

  dmUid = uid;
  dmNick = nick;
  dmRoomId = roomId(myUid, uid);
  unreadDM[uid] = 0;

  document.getElementById('dm-with-name').textContent = nick;
  document.getElementById('panel-dm').classList.add('open');
  document.getElementById('dm-messages').innerHTML = '';

  // update badge
  const badge = document.getElementById('badge-' + uid);
  if (badge) { badge.textContent = ''; badge.classList.remove('show'); }

  // mark active
  document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));

  // listen DM messages
  const msgContainer = document.getElementById('dm-messages');
  dmListener = db.ref('dms/' + dmRoomId + '/messages').limitToLast(100).on('child_added', snap => {
    const msg = snap.val();
    renderDMMsg(msg, msgContainer);
    scrollBottom(msgContainer);
  });

  // DM send
  const dmInput = document.getElementById('dm-input');
  const dmBtn = document.getElementById('dm-send');
  dmBtn.onclick = sendDM;
  dmInput.onkeydown = e => { if (e.key === 'Enter') sendDM(); };
}

function renderDMMsg(msg, container) {
  const isSelf = msg.uid === myUid;
  const div = document.createElement('div');
  div.className = 'msg-row' + (isSelf ? ' self' : '');

  if (msg.type === 'file') {
    div.innerHTML = `
      <div class="msg-meta">
        <span class="msg-author" style="color:${avatarColor(msg.uid)}">${msg.nick}</span>
        <span class="msg-time">${formatTime(msg.ts)}</span>
      </div>
      <div class="file-msg">
        <div class="file-icon">📄</div>
        <div class="file-info">
          <div class="file-name">${escapeHtml(msg.fileName)}</div>
          <div class="file-dl" onclick="window.open('${msg.url}','_blank')">下載 ↓</div>
        </div>
      </div>
    `;
  } else {
    div.innerHTML = `
      <div class="msg-meta">
        <span class="msg-author" style="color:${avatarColor(msg.uid)}">${msg.nick}</span>
        <span class="msg-time">${formatTime(msg.ts)}</span>
      </div>
      <div class="msg-bubble">${escapeHtml(msg.text)}</div>
    `;
  }
  container.appendChild(div);

  // unread badge when DM panel not open
  if (!isSelf && (!document.getElementById('panel-dm').classList.contains('open') || dmUid !== msg.uid)) {
    unreadDM[msg.uid] = (unreadDM[msg.uid] || 0) + 1;
    const badge = document.getElementById('badge-' + msg.uid);
    if (badge) { badge.textContent = unreadDM[msg.uid]; badge.classList.add('show'); }
  }
}

async function sendDM() {
  if (!dmRoomId) return;
  const input = document.getElementById('dm-input');
  const text = input.value.trim();
  const file = selectedFile;

  if (!text && !file) return;
  input.value = '';

  if (file) {
    await uploadAndSend(file);
    selectedFile = null;
    document.getElementById('file-preview-name').textContent = '';
    document.getElementById('dm-file-input').value = '';
  }

  if (text) {
    await db.ref('dms/' + dmRoomId + '/messages').push({
      uid: myUid, nick: myNick,
      text, ts: firebase.database.ServerValue.TIMESTAMP
    });
  }
}

// ════════════════════════════════════════════════════
//  FILE UPLOAD
// ════════════════════════════════════════════════════
document.getElementById('dm-file-input').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  if (file.size > MAX_FILE_MB * 1024 * 1024) {
    toast(`檔案不能超過 ${MAX_FILE_MB}MB`);
    this.value = '';
    return;
  }
  selectedFile = file;
  document.getElementById('file-preview-name').textContent = file.name;
});

async function uploadAndSend(file) {
  const btn = document.getElementById('dm-send');
  btn.disabled = true;
  const progressBar = document.getElementById('upload-progress-bar');
  const fill = document.getElementById('upload-fill');
  progressBar.style.display = 'block';

  try {
    const path = `dms/${dmRoomId}/${Date.now()}_${file.name}`;
    const ref = storage.ref(path);
    const task = ref.put(file);

    await new Promise((resolve, reject) => {
      task.on('state_changed',
        snap => {
          const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
          fill.style.width = pct + '%';
        },
        reject,
        resolve
      );
    });

    const url = await ref.getDownloadURL();
    await db.ref('dms/' + dmRoomId + '/messages').push({
      uid: myUid, nick: myNick,
      type: 'file', fileName: file.name, url,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    toast('檔案傳送成功！');
  } catch (err) {
    console.error(err);
    toast('上傳失敗：' + err.message);
  } finally {
    btn.disabled = false;
    progressBar.style.display = 'none';
    fill.style.width = '0%';
  }
}

// ════════════════════════════════════════════════════
//  CLOSE DM
// ════════════════════════════════════════════════════
document.getElementById('close-dm').addEventListener('click', () => {
  document.getElementById('panel-dm').classList.remove('open');
  if (dmRoomId && dmListener) {
    db.ref('dms/' + dmRoomId + '/messages').off('child_added', dmListener);
  }
  dmUid = null; dmNick = null; dmRoomId = null; dmListener = null;
  document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
});

// ════════════════════════════════════════════════════
//  HAMBURGER (mobile)
// ════════════════════════════════════════════════════
document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('panel-left').classList.toggle('mob-open');
});

// ════════════════════════════════════════════════════
//  XSS PROTECTION
// ════════════════════════════════════════════════════
function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
</script>
