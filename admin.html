<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRoom 管理後台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c14;--bg2:#0d1320;--bg3:#111827;--border:rgba(255,255,255,0.07);--accent:#22d3ee;--accent2:#818cf8;--danger:#f87171;--warn:#fbbf24;--text:#e2e8f0;--muted:#64748b;--online:#34d399}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Login */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#login-screen.hide{display:none}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 0 80px rgba(34,211,238,0.08)}
.login-logo{font-size:1.8rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{color:var(--muted);font-size:0.85rem;margin-bottom:32px;line-height:1.6}
.btn-google{width:100%;padding:13px;background:#fff;color:#333;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.15s,transform 0.1s}
.btn-google:hover{background:#f1f1f1;transform:translateY(-1px)}
.btn-google img{width:20px;height:20px}
.login-hint{margin-top:16px;font-size:0.78rem;color:var(--muted)}

/* Denied */
#denied-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg)}
#denied-screen.show{display:flex}
.denied-card{background:var(--bg2);border:1px solid var(--danger);border-radius:20px;padding:40px;text-align:center;width:340px}
.denied-icon{font-size:3rem;margin-bottom:16px}
.denied-title{font-size:1.2rem;font-weight:700;color:var(--danger);margin-bottom:8px}
.denied-sub{color:var(--muted);font-size:0.85rem;margin-bottom:24px}
.btn-logout{padding:10px 24px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:0.85rem}

/* Main */
#main{display:none;flex-direction:column;min-height:100vh}
#main.show{display:flex}

/* Topbar */
.topbar{padding:0 24px;height:60px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-logo{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{display:flex;align-items:center;gap:16px}
.admin-tag{background:rgba(34,211,238,0.1);border:1px solid var(--accent);color:var(--accent);font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:0.5px}
.btn-signout{padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:0.82rem;transition:all 0.15s}
.btn-signout:hover{border-color:var(--danger);color:var(--danger)}

/* Stats bar */
.stats-bar{padding:16px 24px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap}
.stat-chip{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 18px;text-align:center;min-width:100px}
.stat-chip .n{font-size:1.6rem;font-weight:800;color:var(--accent)}
.stat-chip .l{font-size:0.7rem;color:var(--muted);margin-top:2px}

/* Filters */
.filters{padding:16px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
.filter-btn{padding:6px 16px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.82rem;font-family:inherit;transition:all 0.15s}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:rgba(34,211,238,0.12);border-color:var(--accent);color:var(--accent)}
.search-input{padding:6px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:99px;color:var(--text);font-size:0.82rem;font-family:inherit;outline:none;width:220px;transition:border-color 0.2s}
.search-input:focus{border-color:var(--accent)}
.btn-refresh{margin-left:auto;padding:6px 16px;background:var(--accent);color:#000;border:none;border-radius:99px;font-size:0.82rem;font-weight:700;cursor:pointer;transition:opacity 0.2s}
.btn-refresh:hover{opacity:0.85}

/* Message list */
.msg-list{padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.msg-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color 0.15s}
.msg-card:hover{border-color:rgba(255,255,255,0.15)}
.msg-card.recalled{border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.03)}
.msg-card.file-msg{border-color:rgba(129,140,248,0.3)}
.msg-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.msg-avatar-sm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0}
.msg-nick{font-size:0.85rem;font-weight:600}
.msg-email{font-size:0.72rem;color:var(--muted)}
.msg-time-full{font-size:0.72rem;color:var(--muted);margin-left:auto}
.tag{font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:0.5px}
.tag-recalled{background:rgba(248,113,113,0.15);color:var(--danger);border:1px solid rgba(248,113,113,0.3)}
.tag-global{background:rgba(34,211,238,0.1);color:var(--accent);border:1px solid rgba(34,211,238,0.2)}
.tag-dm{background:rgba(129,140,248,0.1);color:var(--accent2);border:1px solid rgba(129,140,248,0.2)}
.tag-file{background:rgba(251,191,36,0.1);color:var(--warn);border:1px solid rgba(251,191,36,0.2)}
.msg-text{font-size:0.88rem;line-height:1.6;color:var(--text);background:var(--bg);padding:10px 14px;border-radius:8px;word-break:break-word}
.msg-text.is-recalled{color:var(--danger);font-style:italic}
.msg-recalled-badge{font-size:0.75rem;color:var(--danger);margin-top:6px;display:flex;align-items:center;gap:4px}
.msg-actions{margin-top:10px;display:flex;gap:8px}
.btn-action{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.78rem;font-family:inherit;transition:all 0.15s}
.btn-action:hover{border-color:var(--accent);color:var(--accent)}
.btn-action.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn-action.restore:hover{border-color:var(--online);color:var(--online)}

/* DM room label */
.dm-room-label{font-size:0.72rem;color:var(--accent2);margin-top:4px}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:0.9rem}
.empty-icon{font-size:3rem;margin-bottom:12px}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:0.85rem}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg2);border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-size:0.85rem;opacity:0;transition:all 0.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🛡️ 管理後台</div>
    <div class="login-sub">ChatRoom Admin Panel<br>僅限授權管理員登入</div>
    <button class="btn-google" id="btn-login">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
      使用 Google 帳號登入
    </button>
    <div class="login-hint">🔒 僅 issac@sjps.kh.edu.tw 可存取</div>
  </div>
</div>

<!-- Denied -->
<div id="denied-screen">
  <div class="denied-card">
    <div class="denied-icon">🚫</div>
    <div class="denied-title">存取被拒絕</div>
    <div class="denied-sub" id="denied-email">你的帳號沒有管理員權限</div>
    <button class="btn-logout" id="btn-denied-logout">登出並返回</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div class="topbar">
    <div class="topbar-logo">🛡️ ChatRoom Admin</div>
    <div class="topbar-right">
      <span class="admin-tag">ADMIN</span>
      <span id="admin-email" style="font-size:0.8rem;color:var(--muted)"></span>
      <button class="btn-signout" id="btn-signout">登出</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-chip"><div class="n" id="st-total">—</div><div class="l">全部訊息</div></div>
    <div class="stat-chip"><div class="n" id="st-recalled" style="color:var(--danger)">—</div><div class="l">已收回</div></div>
    <div class="stat-chip"><div class="n" id="st-global" style="color:var(--accent)">—</div><div class="l">大廳</div></div>
    <div class="stat-chip"><div class="n" id="st-dm" style="color:var(--accent2)">—</div><div class="l">私訊</div></div>
    <div class="stat-chip"><div class="n" id="st-users" style="color:var(--online)">—</div><div class="l">用戶數</div></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="recalled">🔴 收回訊息</button>
    <button class="filter-btn" data-filter="all">📋 全部訊息</button>
    <button class="filter-btn" data-filter="global">💬 大廳</button>
    <button class="filter-btn" data-filter="dm">📩 私訊</button>
    <input class="search-input" id="search-input" placeholder="搜尋暱稱或內容…" type="text">
    <button class="btn-refresh" id="btn-refresh">⟳ 重新載入</button>
  </div>

  <div class="msg-list" id="msg-list">
    <div class="loading">載入中…</div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getDatabase, ref as dbRef, get, update, remove }
  from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsjUt0p8q0lV5ThMnAfJva60YkvfP-jlk",
  authDomain: "onlinechat-aa697.firebaseapp.com",
  projectId: "onlinechat-aa697",
  storageBucket: "onlinechat-aa697.firebasestorage.app",
  messagingSenderId: "783019025687",
  appId: "1:783019025687:web:01676384ee6fd544034352",
  databaseURL: "https://onlinechat-aa697-default-rtdb.asia-southeast1.firebasedatabase.app"
};

// ── 管理員白名單（email）──
const ADMIN_EMAILS = ['issac@sjps.kh.edu.tw'];

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);
const googleProvider = new GoogleAuthProvider();

let allMessages = [];   // 所有訊息的快取
let currentFilter = 'recalled';
let searchQuery = '';

// ── Utility ──
function toast(msg, dur=3000){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatFull(ts){
  if(!ts)return '—';
  const d=new Date(ts+8*60*60*1000);
  return `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')}`;
}
const AVATAR_COLORS=['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#10b981','#6366f1','#f59e0b','#84cc16','#0ea5e9'];
function avatarColor(uid){let h=0;for(let c of (uid||''))h=(h*31+c.charCodeAt(0))&0xffffff;return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];}
function initials(name){return(name||'?').slice(0,2).toUpperCase();}

// ── Auth ──
onAuthStateChanged(auth, user => {
  if(!user){
    show('login-screen'); hide('main'); hide('denied-screen'); return;
  }
  const email = user.email || '';
  if(ADMIN_EMAILS.includes(email)){
    // 管理員
    hide('login-screen'); hide('denied-screen'); show('main');
    document.getElementById('admin-email').textContent = email;
    loadAll();
  } else {
    // 不是管理員
    hide('login-screen'); hide('main'); show('denied-screen');
    document.getElementById('denied-email').textContent = `登入帳號：${email}`;
  }
});

function show(id){
  const el=document.getElementById(id);
  if(el.id==='main') el.classList.add('show');
  else if(el.id==='denied-screen') el.classList.add('show');
  else el.classList.remove('hide');
}
function hide(id){
  const el=document.getElementById(id);
  if(el.id==='main') el.classList.remove('show');
  else if(el.id==='denied-screen') el.classList.remove('show');
  else el.classList.add('hide');
}

document.getElementById('btn-login').addEventListener('click', async()=>{
  try{ await signInWithPopup(auth, googleProvider); }
  catch(e){ toast('登入失敗：'+e.message); }
});
document.getElementById('btn-signout').addEventListener('click', ()=>signOut(auth));
document.getElementById('btn-denied-logout').addEventListener('click', ()=>signOut(auth));
document.getElementById('btn-refresh').addEventListener('click', ()=>loadAll());

// ── Load all messages ──
async function loadAll(){
  document.getElementById('msg-list').innerHTML='<div class="loading">📡 載入資料中…</div>';
  allMessages = [];

  // 大廳訊息
  const globalSnap = await get(dbRef(db,'global/messages'));
  if(globalSnap.exists()){
    globalSnap.forEach(child=>{
      const m=child.val();
      allMessages.push({ ...m, _key:child.key, _source:'global', _roomId:null });
    });
  }

  // 私訊（掃所有房間）
  const dmsSnap = await get(dbRef(db,'dms'));
  if(dmsSnap.exists()){
    dmsSnap.forEach(room=>{
      const roomId=room.key;
      room.child('messages').forEach(child=>{
        const m=child.val();
        allMessages.push({ ...m, _key:child.key, _source:'dm', _roomId:roomId });
      });
    });
  }

  // 用戶列表
  const presSnap = await get(dbRef(db,'presence'));
  const userCount = presSnap.exists() ? Object.keys(presSnap.val()).length : 0;

  // 統計
  const total   = allMessages.length;
  const recalled = allMessages.filter(m=>m.recalled).length;
  const global  = allMessages.filter(m=>m._source==='global').length;
  const dm      = allMessages.filter(m=>m._source==='dm').length;
  document.getElementById('st-total').textContent   = total;
  document.getElementById('st-recalled').textContent = recalled;
  document.getElementById('st-global').textContent  = global;
  document.getElementById('st-dm').textContent      = dm;
  document.getElementById('st-users').textContent   = userCount;

  // 按時間排序（新→舊）
  allMessages.sort((a,b)=>(b.ts||0)-(a.ts||0));

  renderList();
}

// ── Render ──
function renderList(){
  const list = document.getElementById('msg-list');
  let msgs = allMessages;

  // Filter
  if(currentFilter==='recalled') msgs=msgs.filter(m=>m.recalled);
  else if(currentFilter==='global') msgs=msgs.filter(m=>m._source==='global');
  else if(currentFilter==='dm') msgs=msgs.filter(m=>m._source==='dm');

  // Search
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    msgs=msgs.filter(m=>(m.nick||'').toLowerCase().includes(q)||(m.text||'').toLowerCase().includes(q));
  }

  if(!msgs.length){
    list.innerHTML=`<div class="empty"><div class="empty-icon">${currentFilter==='recalled'?'✅':'🔍'}</div>${currentFilter==='recalled'?'目前沒有已收回的訊息':'找不到符合的訊息'}</div>`;
    return;
  }

  list.innerHTML='';
  msgs.forEach(msg=>{
    const card=document.createElement('div');
    card.className='msg-card'+(msg.recalled?' recalled':'')+(msg.type==='file'?' file-msg':'');

    const color=avatarColor(msg.uid||'');
    const srcTag=msg._source==='global'
      ?'<span class="tag tag-global">大廳</span>'
      :`<span class="tag tag-dm">私訊</span>`;
    const recalledTag=msg.recalled?'<span class="tag tag-recalled">已收回</span>':'';
    const fileTag=msg.type==='file'?'<span class="tag tag-file">檔案</span>':'';
    const dmRoom=msg._source==='dm'&&msg._roomId
      ?`<div class="dm-room-label">房間：${msg._roomId}</div>`:'';

    let textContent='';
    if(msg.type==='file'){
      textContent=`<div class="msg-text">📎 <strong>${escapeHtml(msg.fileName||'')}</strong><br><a href="${msg.url||''}" target="_blank" style="color:var(--accent);font-size:0.8rem">⬇ 開啟檔案</a></div>`;
    } else {
      const isRecalled=msg.recalled;
      const displayText=isRecalled&&msg.text==='[訊息已收回]'?'（原文已被覆蓋）':escapeHtml(msg.text||'');
      // 若 recalled 且原文仍在（不等於 [訊息已收回]）顯示原文
      const actualText=msg.recalled&&msg.text&&msg.text!=='[訊息已收回]'
        ?`<div class="msg-text is-recalled">🔴 原文：${escapeHtml(msg.text)}</div>`
        :`<div class="msg-text">${displayText}</div>`;
      textContent=actualText;
    }

    card.innerHTML=`
      <div class="msg-header">
        <div class="msg-avatar-sm" style="background:${color}">${initials(msg.nick)}</div>
        <div>
          <div class="msg-nick">${escapeHtml(msg.nick||'未知')}</div>
          <div class="msg-email" style="font-size:0.68rem;color:var(--muted)">${msg.uid||''}</div>
        </div>
        ${srcTag}${recalledTag}${fileTag}
        <div class="msg-time-full">${formatFull(msg.ts)}</div>
      </div>
      ${dmRoom}
      ${textContent}
      <div class="msg-actions" id="actions-${msg._key}"></div>
    `;

    // 動態加按鈕
    const actions=card.querySelector('.msg-actions');
    if(msg.recalled){
      const restoreBtn=document.createElement('button');
      restoreBtn.className='btn-action restore';restoreBtn.textContent='↩ 還原訊息';
      restoreBtn.addEventListener('click',()=>restoreMsg(msg));
      actions.appendChild(restoreBtn);
    }
    const delBtn=document.createElement('button');
    delBtn.className='btn-action danger';delBtn.textContent='🗑 永久刪除';
    delBtn.addEventListener('click',()=>deleteMsg(msg));
    actions.appendChild(delBtn);

    list.appendChild(card);
  });
}

// ── Actions ──
async function restoreMsg(msg){
  if(!confirm(`確定還原「${msg.nick}」的訊息？`))return;
  const path=msg._source==='global'
    ?`global/messages/${msg._key}`
    :`dms/${msg._roomId}/messages/${msg._key}`;
  await update(dbRef(db,path),{recalled:false});
  toast('✅ 訊息已還原');
  await loadAll();
}

async function deleteMsg(msg){
  if(!confirm(`⚠️ 確定永久刪除「${msg.nick}」的訊息？此操作無法復原。`))return;
  const path=msg._source==='global'
    ?`global/messages/${msg._key}`
    :`dms/${msg._roomId}/messages/${msg._key}`;
  await remove(dbRef(db,path));
  toast('🗑 訊息已永久刪除');
  await loadAll();
}

// ── Filter & Search ──
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    renderList();
  });
});

document.getElementById('search-input').addEventListener('input',e=>{
  searchQuery=e.target.value.trim();
  renderList();
});
</script>
</body>
</html>
