<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c14;--bg2:#0d1320;--bg3:#111827;--border:rgba(255,255,255,0.07);--accent:#22d3ee;--accent2:#818cf8;--danger:#f87171;--text:#e2e8f0;--muted:#64748b;--online:#34d399;--msg-self:#1e3a5f;--msg-other:#1a1f2e;--panel-w:240px;--dm-w:320px}
html,body{height:100%;overflow:hidden;overscroll-behavior-y:contain}
@media(max-width:768px){html,body{overflow:auto;overscroll-behavior-y:auto}}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#loading-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.5s}
#loading-screen.hide{opacity:0;pointer-events:none}
.loader-logo{font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.loader-bar{width:200px;height:2px;background:var(--border);border-radius:99px;overflow:hidden}
.loader-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;animation:load 1.5s ease-in-out forwards}
@keyframes load{from{width:0}to{width:100%}}
#nick-modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
#nick-modal.hide{display:none}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px;width:340px;box-shadow:0 0 60px rgba(34,211,238,0.08)}
.modal-title{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:6px}
.modal-sub{color:var(--muted);font-size:0.85rem;margin-bottom:20px}
.modal-input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.95rem;font-family:inherit;outline:none;transition:border-color 0.2s;margin-bottom:12px}
.modal-input:focus{border-color:var(--accent)}
.btn-enter{width:100%;padding:10px;background:var(--accent);color:#000;font-weight:700;font-family:'Syne',sans-serif;font-size:0.95rem;letter-spacing:0.5px;border:none;border-radius:8px;cursor:pointer;transition:opacity 0.2s}
.btn-enter:hover{opacity:0.85}
#app{display:flex;height:100vh}
#panel-left{width:var(--panel-w);min-width:var(--panel-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.panel-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.panel-section{padding:10px 14px 4px;font-size:0.7rem;font-weight:600;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.user-list{flex:1;overflow-y:auto;padding:4px 8px}
.user-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background 0.15s;position:relative}
.user-item:hover{background:rgba(255,255,255,0.04)}
.user-item.active{background:rgba(34,211,238,0.08)}
.user-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0;position:relative}
.avatar-dot{position:absolute;bottom:0;right:0;width:9px;height:9px;background:var(--online);border-radius:50%;border:2px solid var(--bg2)}
.user-name{font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-name.you{color:var(--accent)}
.dm-badge{margin-left:auto;background:var(--accent);color:#000;font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center;display:none}
.dm-badge.show{display:block}
.my-info{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.my-name{font-size:0.85rem;font-weight:500}
.my-status{font-size:0.72rem;color:var(--online)}
#main-chat{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-topbar{padding:0 20px;height:56px;min-height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.chat-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem}
.online-count{font-size:0.8rem;color:var(--muted)}
.online-count span{color:var(--online);font-weight:600}
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.msg-row{display:flex;flex-direction:row;align-items:flex-end;gap:8px;margin-bottom:10px;max-width:80%}
.msg-row.self{flex-direction:row-reverse;margin-left:auto}
.msg-row.other{margin-right:auto}
.msg-avatar{width:34px;height:34px;min-width:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;flex-shrink:0;align-self:flex-end;transition:transform 0.15s,box-shadow 0.15s;cursor:pointer}
.msg-avatar:hover{transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,255,255,0.2)}
.msg-content{display:flex;flex-direction:column;gap:3px}
.msg-row.self .msg-content{align-items:flex-end}
.msg-row.other .msg-content{align-items:flex-start}
.msg-meta{display:flex;align-items:baseline;gap:6px;padding:0 4px}
.msg-row.self .msg-meta{flex-direction:row-reverse}
.msg-author{font-size:0.75rem;font-weight:600}
.msg-time{font-size:0.68rem;color:var(--muted)}
.msg-bubble{display:inline-block;padding:9px 13px;border-radius:18px;font-size:0.875rem;line-height:1.55;max-width:100%;word-break:break-word}
.msg-row.other .msg-bubble{background:var(--msg-other);border-bottom-left-radius:4px}
.msg-row.self .msg-bubble{background:var(--accent);color:#000;border-bottom-right-radius:4px}
.msg-system{text-align:center;font-size:0.75rem;color:var(--muted);padding:4px 0}
.msg-delete{opacity:0;font-size:0.75rem;color:var(--muted);cursor:pointer;padding:3px 8px;border-radius:6px;transition:opacity 0.15s,color 0.15s,background 0.15s;background:none;border:1px solid transparent;align-self:center;flex-shrink:0;white-space:nowrap}
.msg-row:hover .msg-delete{opacity:1}
.msg-delete:hover{color:#f87171;border-color:#f87171;background:rgba(248,113,113,0.08)}
.msg-recalled{font-size:0.8rem;color:var(--muted);font-style:italic;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border)}
.chat-input-bar{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.chat-input{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;transition:border-color 0.2s;resize:none;max-height:120px}
.chat-input:focus{border-color:var(--accent)}
.btn-send{padding:0 18px;height:40px;background:var(--accent);color:#000;font-weight:700;font-size:0.85rem;font-family:'Syne',sans-serif;border:none;border-radius:8px;cursor:pointer;transition:opacity 0.2s;white-space:nowrap}
.btn-send:hover{opacity:0.85}
.btn-send:disabled{opacity:0.4;cursor:not-allowed}
.dm-list-header{padding:0 16px;height:56px;min-height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem}
.dm-conv-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background 0.15s;border-radius:10px;margin:2px 8px;position:relative}
.dm-conv-item:hover{background:rgba(255,255,255,0.05)}
.dm-conv-item.active{background:rgba(34,211,238,0.08)}
.dm-conv-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;flex-shrink:0;position:relative}
.dm-conv-avatar .unread-ring{position:absolute;inset:-3px;border:2px solid var(--accent);border-radius:50%;display:none}
.dm-conv-avatar .unread-ring.show{display:block}
.dm-conv-info{flex:1;min-width:0}
.dm-conv-name{font-size:0.85rem;font-weight:600}
.dm-conv-preview{font-size:0.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dm-conv-preview.unread{color:var(--accent);font-weight:500}
.dm-conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dm-conv-time{font-size:0.68rem;color:var(--muted)}
.dm-conv-badge{background:var(--accent);color:#000;font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center;display:none}
.dm-conv-badge.show{display:block}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.dm-conv-item.new-msg .dm-conv-avatar{animation:wiggle 0.5s ease}
#panel-right{width:var(--dm-w);min-width:var(--dm-w);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative}
#dm-list-panel{display:flex;flex-direction:column;height:100%;overflow:hidden}
#dm-list-panel.hide{display:none}
#panel-dm{display:none;flex-direction:column;height:100%;overflow:hidden;position:relative}
#panel-dm.open{display:flex}
.dm-topbar{padding:0 16px;height:56px;min-height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dm-with{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem}
.dm-with span{color:var(--accent)}
.btn-close-dm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px;border-radius:4px;transition:color 0.2s}
.btn-close-dm:hover{color:var(--text)}
.dm-messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.dm-input-area{padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.dm-file-row{display:flex;align-items:center;gap:8px}
.btn-file{padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:0.8rem;cursor:pointer;transition:all 0.2s;white-space:nowrap;display:inline-block}
.btn-file:hover{border-color:var(--accent2);color:var(--accent2)}
#dm-file-input{display:none}
.file-preview{font-size:0.75rem;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.dm-msg-row{display:flex;align-items:center;gap:6px}
.dm-input{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:0.85rem;font-family:inherit;outline:none;transition:border-color 0.2s}
.dm-input:focus{border-color:var(--accent)}
.btn-dm-send{padding:0 14px;height:36px;background:var(--accent2);color:#fff;font-weight:700;font-size:0.8rem;font-family:'Syne',sans-serif;border:none;border-radius:7px;cursor:pointer;transition:opacity 0.2s}
.btn-dm-send:hover{opacity:0.85}
.btn-dm-send:disabled{opacity:0.4;cursor:not-allowed}
.file-msg{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);max-width:240px}
.file-icon{font-size:1.3rem}
.file-info{flex:1;min-width:0}
.file-name{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-dl{font-size:0.72rem;color:var(--accent);cursor:pointer;text-decoration:none}
.file-dl:hover{text-decoration:underline}
.upload-bar{height:2px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:4px}
.upload-fill{height:100%;background:var(--accent2);border-radius:99px;transition:width 0.2s}
.emoji-btn{background:none;border:none;cursor:pointer;font-size:1.15rem;padding:5px 7px;border-radius:7px;color:var(--muted);transition:background 0.15s,transform 0.1s;flex-shrink:0;line-height:1}
.emoji-btn:hover{background:rgba(255,255,255,0.07);transform:scale(1.15)}
.emoji-panel{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:80;display:none;flex-direction:column;overflow:hidden;max-height:280px}
.emoji-panel.open{display:flex}
.emoji-tabs{display:flex;gap:2px;padding:8px 10px 4px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.emoji-tabs::-webkit-scrollbar{height:3px}
.emoji-tab{background:none;border:none;cursor:pointer;font-size:0.72rem;padding:4px 10px;border-radius:6px;color:var(--muted);white-space:nowrap;font-family:inherit;transition:background 0.15s,color 0.15s}
.emoji-tab:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.emoji-tab.active{background:rgba(34,211,238,0.12);color:var(--accent)}
.emoji-search{margin:8px 10px 4px;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:0.82rem;font-family:inherit;outline:none;flex-shrink:0}
.emoji-search:focus{border-color:var(--accent)}
.emoji-grid{display:flex;flex-wrap:wrap;padding:6px 8px 10px;gap:2px;overflow-y:auto;flex:1}
.emoji-item{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border-radius:7px;cursor:pointer;transition:background 0.1s,transform 0.1s;user-select:none}
.emoji-item:hover{background:rgba(255,255,255,0.08);transform:scale(1.2)}
.emoji-item.kaomoji{font-size:0.72rem;width:auto;padding:4px 8px}
.notif-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--bg2);display:none}
.notif-dot.show{display:block}
#notif-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;position:relative;padding:4px 8px;border-radius:6px;transition:background 0.15s}
#notif-btn:hover{background:rgba(255,255,255,0.06)}
#notif-btn[data-blocked="true"]{opacity:0.4;cursor:not-allowed}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg2);border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-size:0.85rem;box-shadow:0 8px 32px rgba(0,0,0,0.4);opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--bg2);border-top:1px solid var(--border);align-items:center;justify-content:space-around;z-index:9999;-webkit-tap-highlight-color:transparent}
#mob-nav button{flex:1;height:100%;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:0.6rem;font-family:inherit;transition:color 0.15s;position:relative}
#mob-nav button.active{color:var(--accent)}
#mob-nav button .nav-icon{font-size:1.3rem;line-height:1}
#mob-nav button .nav-badge{position:absolute;top:6px;right:calc(50% - 16px);background:var(--danger);color:#fff;font-size:0.6rem;font-weight:700;padding:1px 5px;border-radius:99px;display:none}
#mob-nav button .nav-badge.show{display:block}
#mob-overlay{display:none;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,0.5);backdrop-filter:blur(2px)}
#mob-overlay.show{display:block}
.hamburger{display:none;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:4px}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px}
@media(max-width:768px){
  .hamburger{display:none!important}
  #mob-nav{display:flex!important;z-index:9999!important}
  #mob-overlay{z-index:8000;touch-action:none}
  #panel-left{position:fixed;left:0;top:0;bottom:56px;z-index:8500;width:82vw;min-width:unset;max-width:320px;transform:translateX(-105%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:4px 0 30px rgba(0,0,0,0.6);overflow-y:auto}
  #panel-left.mob-show{transform:translateX(0)}
  #panel-right{position:fixed;right:0;top:0;bottom:56px;z-index:8500;width:92vw;min-width:unset;max-width:380px;transform:translateX(105%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:-4px 0 30px rgba(0,0,0,0.6);overflow-y:auto}
  #panel-right.mob-show{transform:translateX(0)}
  #main-chat{padding-bottom:56px;width:100%;min-width:unset;overflow-y:auto}
  #app{overflow:hidden;height:calc(100vh - 56px)}
  #topbar-clock{display:none}
  .msg-bubble{font-size:0.92rem}
  .msg-avatar{width:30px;height:30px;min-width:30px;font-size:0.72rem}
  .msg-row{max-width:90%}
  .chat-input-bar{padding:8px 10px}
  .btn-send{padding:0 10px;font-size:0.8rem}
  .dm-input-area{padding:8px 10px}
  .emoji-panel{max-height:200px}
  .messages,.dm-messages{overflow-y:auto;-webkit-overflow-scrolling:touch}
}
#login-modal{position:fixed;inset:0;z-index:92;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
#login-modal.hide{display:none}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:340px;text-align:center;box-shadow:0 0 80px rgba(34,211,238,0.1)}
.login-title{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:8px}
.login-sub{color:var(--muted);font-size:0.85rem;margin-bottom:28px;line-height:1.5}
.btn-google{width:100%;padding:12px;background:#fff;color:#333;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;transition:background 0.15s,transform 0.1s}
.btn-google:hover{background:#f1f1f1;transform:translateY(-1px)}
.btn-google img{width:20px;height:20px}
.btn-anon{width:100%;padding:10px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;font-size:0.85rem;cursor:pointer;transition:color 0.15s,border-color 0.15s}
.btn-anon:hover{color:var(--text);border-color:var(--text)}
#stats-modal{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center}
#stats-modal.show{display:flex}
.stats-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:28px;width:360px;max-width:92vw;max-height:80vh;overflow-y:auto}
.stats-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stats-card{background:var(--bg);border-radius:12px;padding:14px;text-align:center}
.stats-card .num{font-size:1.8rem;font-weight:800;font-family:'Syne',sans-serif;color:var(--accent)}
.stats-card .label{font-size:0.72rem;color:var(--muted);margin-top:2px}
.stats-section{margin-top:16px}
.stats-section h4{font-size:0.8rem;color:var(--muted);margin-bottom:10px}
.stats-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:0.82rem}
.stats-bar-row .bar-label{width:60px;text-align:right;font-size:0.75rem;color:var(--muted)}
.stats-bar-row .bar-track{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.stats-bar-row .bar-fill{height:100%;background:var(--accent);border-radius:99px}
.stats-emoji-row{display:flex;flex-wrap:wrap;gap:8px}
.stats-emoji-item{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:0.82rem}
.typing-indicator{font-size:0.75rem;color:var(--muted);padding:2px 20px;min-height:20px;font-style:italic}
</style>
</head>
<body>
<div id="login-modal" class="hide">
  <div class="login-box">
    <div class="login-title">💬 ChatRoom</div>

<script type="module">

import { getDatabase, ref as dbRef, set, get, push, remove, update, onValue, onChildAdded, onChildChanged, onDisconnect, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsjUt0p8q0lV5ThMnAfJva60YkvfP-jlk",
  authDomain: "onlinechat-aa697.firebaseapp.com",
  projectId: "onlinechat-aa697",
  storageBucket: "onlinechat-aa697.firebasestorage.app",
  messagingSenderId: "783019025687",
  appId: "1:783019025687:web:01676384ee6fd544034352",
  measurementId: "G-QTR14CXC41",
  databaseURL: "https://onlinechat-aa697-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const MAX_GLOBAL_MSGS = 100;
const MAX_FILE_MB = 50;
const UPLOAD_LIMIT_GB = 1.0;
const DOWNLOAD_LIMIT_GB = 1.0;
const UPLOAD_LIMIT_BYTES = UPLOAD_LIMIT_GB * 1024 * 1024 * 1024;
const DOWNLOAD_LIMIT_BYTES = DOWNLOAD_LIMIT_GB * 1024 * 1024 * 1024;
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzv4pMvysa3xHEKzf2Q5clILmDEdVp-whqGU1ZP5J_OmEStRZnyyMWLSdxbbNqolY17iQ/exec';
const AVATAR_COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#10b981','#6366f1','#f59e0b','#84cc16','#0ea5e9'];
const WEEKDAYS = ['日','一','二','三','四','五','六'];

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getDatabase(app);
const googleProvider = new GoogleAuthProvider();

let myUid=null, myNick=null, dmUid=null, dmNick=null, dmRoomId=null, dmUnsub=null;
let typingTimer=null, pendingColor=null, isGoogleUser=false, authHandled=false, loadingDone=false;
let todayUploadBytes=0, todayDownloadBytes=0, notifEnabled=false, notifBlocked=false;
let mobCurrentTab='lobby';
const unreadDM={};

// ── Utility ──
const getUserColor = uid => localStorage.getItem('avatarColor_'+uid)||null;
const avatarColor = uid => { const c=getUserColor(uid); if(c) return c; let h=0; for(let x of uid) h=(h*31+x.charCodeAt(0))&0xffffff; return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length]; };
const getAvatarText = (uid,name) => { const c=localStorage.getItem('avatarText_'+(uid||'')); if(c&&c.trim()) return c.trim().slice(0,2); return (name||'?').slice(0,2).toUpperCase(); };
const initials = name => (name||'?').slice(0,2).toUpperCase();
const formatTime = ts => { const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); };
const makeRoomId = (a,b) => [a,b].sort().join('__');
const escapeHtml = str => String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const scrollBottom = el => el.scrollTop=el.scrollHeight;
const autoResize = ta => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; };
const isMobile = () => window.innerWidth<=768;
const dateKey = () => new Date(Date.now()+8*60*60*1000).toISOString().slice(0,10);
const fmtBytes = b => b>=1073741824?(b/1073741824).toFixed(2)+' GB':b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?(b/1024).toFixed(0)+' KB':b+' B';
const barColor = pct => pct>=90?'#f87171':pct>=60?'#fbbf24':'#22d3ee';
const isQuotaExceeded = () => false; // 無限空間，不限制

function toast(msg,duration=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),duration);}

// ── Quota ──
async function loadQuota(){
  const dk=dateKey();
  const [us,ds]=await Promise.all([get(dbRef(db,`quota/${dk}/upload`)),get(dbRef(db,`quota/${dk}/download`))]);
  todayUploadBytes=us.exists()?us.val():0; todayDownloadBytes=ds.exists()?ds.val():0; updateQuotaUI();
  onValue(dbRef(db,`quota/${dk}/upload`),s=>{todayUploadBytes=s.exists()?s.val():0;updateQuotaUI();});
  onValue(dbRef(db,`quota/${dk}/download`),s=>{todayDownloadBytes=s.exists()?s.val():0;updateQuotaUI();});
}
async function addUpload(b){todayUploadBytes+=b;await set(dbRef(db,`quota/${dateKey()}/upload`),todayUploadBytes);updateQuotaUI();}
async function addDownload(b){todayDownloadBytes+=b;await set(dbRef(db,`quota/${dateKey()}/download`),todayDownloadBytes);updateQuotaUI();}
function updateQuotaUI(){
  const up=Math.min(todayUploadBytes/UPLOAD_LIMIT_BYTES*100,100);
  const dl=Math.min(todayDownloadBytes/DOWNLOAD_LIMIT_BYTES*100,100);
  const uf=document.getElementById('upload-bar-fill'),df=document.getElementById('download-bar-fill');
  const ul=document.getElementById('upload-label'),dll=document.getElementById('download-label');
  if(uf){uf.style.width=up+'%';uf.style.background=barColor(up);}
  if(df){df.style.width=dl+'%';df.style.background=barColor(dl);}
  if(ul) ul.textContent=fmtBytes(todayUploadBytes)+' / '+UPLOAD_LIMIT_GB+' GB';
  if(dll) dll.textContent=fmtBytes(todayDownloadBytes)+' / '+DOWNLOAD_LIMIT_GB+' GB';
}

// ── Clock ──
function updateClock(){
  const el=document.getElementById('topbar-clock');if(!el)return;
  const n=new Date(Date.now()+8*60*60*1000);
  const Y=n.getUTCFullYear(),M=String(n.getUTCMonth()+1).padStart(2,'0'),D=String(n.getUTCDate()).padStart(2,'0');
  const wd=WEEKDAYS[n.getUTCDay()],h=String(n.getUTCHours()).padStart(2,'0'),m=String(n.getUTCMinutes()).padStart(2,'0'),s=String(n.getUTCSeconds()).padStart(2,'0');
  el.innerHTML=`<span style="color:var(--text);font-weight:600">${Y}/${M}/${D}</span> <span style="color:var(--accent);font-size:0.75rem">(${wd})</span><br><span style="color:var(--text);font-weight:700;font-size:0.9rem;letter-spacing:1px">${h}:${m}:${s}</span>`;
}
function startClock(){updateClock();const ms=1000-(Date.now()%1000);setTimeout(()=>{updateClock();setInterval(updateClock,1000);},ms);}

// ── TTS ──
function speakFileReceived(){try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('檔案已送達，請收件');u.lang='zh-TW';u.rate=0.95;u.volume=0.9;window.speechSynthesis.speak(u);}catch(e){}}

// ── DM Conv List ──
const getDMConvs=()=>{try{return JSON.parse(localStorage.getItem('dmConvs_v2')||'{}');}catch{return {};}};
const saveDMConvs=convs=>localStorage.setItem('dmConvs_v2',JSON.stringify(convs));
function updateDMConv(uid,nick,color,lastMsg,isIncoming){
  const convs=getDMConvs(),prev=convs[uid]||{};
  convs[uid]={nick,color,lastMsg:String(lastMsg).slice(0,60),lastTs:Date.now(),unread:isIncoming?(prev.unread||0)+1:(prev.unread||0)};
  saveDMConvs(convs);renderDMConvList();
}
function clearDMConvUnread(uid){const convs=getDMConvs();if(convs[uid]){convs[uid].unread=0;saveDMConvs(convs);}renderDMConvList();}
function renderDMConvList(){
  const list=document.getElementById('dm-conv-list');if(!list)return;
  const convs=getDMConvs(),sorted=Object.entries(convs).sort((a,b)=>(b[1].lastTs||0)-(a[1].lastTs||0));
  list.innerHTML='';
  if(!sorted.length){list.innerHTML='<div style="text-align:center;color:var(--muted);font-size:0.8rem;padding:20px">還沒有私訊紀錄</div>';return;}
  const total=sorted.reduce((s,[u,i])=>s+(u!==dmUid?(i.unread||0):0),0);
  updateMobDMBadge(total);
  sorted.forEach(([uid,info])=>{
    const item=document.createElement('div');
    item.className='dm-conv-item'+(uid===dmUid?' active':'');
    item.dataset.uid=uid;
    const hu=info.unread>0&&uid!==dmUid;
    item.innerHTML=`<div class="dm-conv-avatar" style="background:${info.color||'#3b82f6'}">${initials(info.nick)}<div class="unread-ring ${hu?'show':''}"></div></div><div class="dm-conv-info"><div class="dm-conv-name">${escapeHtml(info.nick)}</div><div class="dm-conv-preview ${hu?'unread':''}">${escapeHtml(info.lastMsg||'')}</div></div><div class="dm-conv-meta"><div class="dm-conv-time">${info.lastTs?formatTime(info.lastTs):''}</div><div class="dm-conv-badge ${hu?'show':''}">${info.unread||''}</div></div>`;
    item.addEventListener('click',()=>openDM(uid,info.nick));
    list.appendChild(item);
  });
}
function wiggleConvItem(uid){const item=document.querySelector(`.dm-conv-item[data-uid="${uid}"]`);if(!item)return;item.classList.remove('new-msg');void item.offsetWidth;item.classList.add('new-msg');setTimeout(()=>item.classList.remove('new-msg'),600);}

// ── Rename ──
async function renameInDB(oldNick,newNick){
  if(oldNick===newNick)return;toast('⏳ 更新舊訊息中…');
  const updates={};let count=0;
  const gs=await get(dbRef(db,'global/messages'));
  if(gs.exists()) gs.forEach(c=>{if(c.val().uid===myUid){updates['global/messages/'+c.key+'/nick']=newNick;count++;}});
  const ds=await get(dbRef(db,'dms'));
  if(ds.exists()) ds.forEach(room=>room.child('messages').forEach(c=>{if(c.val().uid===myUid){updates['dms/'+room.key+'/messages/'+c.key+'/nick']=newNick;count++;}}));
  if(Object.keys(updates).length) await update(dbRef(db),updates);
  toast(`✅ 暱稱已更新，共修改 ${count} 則訊息`);

let activeEmojiTab='笑臉';
function buildEmojiPanel(panelId,targetId){
  const panel=document.getElementById(panelId);panel.innerHTML='';
  const search=document.createElement('input');search.className='emoji-search';search.placeholder='搜尋…';panel.appendChild(search);
  const tabs=document.createElement('div');tabs.className='emoji-tabs';
  Object.keys(EMOJI_DATA).forEach(cat=>{
    const tab=document.createElement('button');tab.className='emoji-tab'+(cat===activeEmojiTab?' active':'');tab.textContent=cat;
    tab.addEventListener('click',()=>{tabs.querySelectorAll('.emoji-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');activeEmojiTab=cat;renderGrid(cat);});
    tabs.appendChild(tab);
  });
  panel.appendChild(tabs);
  const grid=document.createElement('div');grid.className='emoji-grid';panel.appendChild(grid);
  function renderGrid(cat,filter=''){
    grid.innerHTML='';
    const items=filter?Object.values(EMOJI_DATA).flat().filter(e=>e.includes(filter)):EMOJI_DATA[cat]||[];
    items.forEach(em=>{const el=document.createElement('div');el.className='emoji-item'+(em.length>2&&!em.match(/\p{Emoji}/u)?' kaomoji':'');el.textContent=em;el.addEventListener('click',()=>insertEmoji(targetId,em));grid.appendChild(el);});
  }
  renderGrid(activeEmojiTab);
  search.addEventListener('input',()=>{const q=search.value.trim();q?renderGrid(null,q):renderGrid(activeEmojiTab);});
}
function insertEmoji(targetId,emoji){
  const input=document.getElementById(targetId);if(!input)return;
  const s=input.selectionStart??input.value.length,e=input.selectionEnd??input.value.length;
  input.value=input.value.slice(0,s)+emoji+input.value.slice(e);
  const p=s+emoji.length;input.setSelectionRange(p,p);input.focus();
  if(input.tagName==='TEXTAREA') autoResize(input);
}
function toggleEmojiPanel(panelId,targetId){

function buildColorPicker(containerId,selectedColor,onSelect){
  const container=document.getElementById(containerId);if(!container)return;container.innerHTML='';
  AVATAR_COLORS.forEach(color=>{
    const s=document.createElement('div');
    s.style.cssText=`width:28px;height:28px;border-radius:50%;background:${color};cursor:pointer;border:3px solid ${color===selectedColor?'#fff':'transparent'};transition:transform 0.15s,border-color 0.15s;box-sizing:border-box;`;

    container.appendChild(s);
  });

async function loadStats(){
  let msgCount=0,fileCount=0;const hourMap={},emojiMap={};
  const gs=await get(dbRef(db,'global/messages'));
  if(gs.exists()) gs.forEach(c=>{const m=c.val();if(m.uid!==myUid)return;if(m.type==='file'){fileCount++;return;}msgCount++;if(m.ts){const h=new Date(m.ts+28800000).getUTCHours();hourMap[h]=(hourMap[h]||0)+1;}const em=(m.text||'').match(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu)||[];em.forEach(e=>{emojiMap[e]=(emojiMap[e]||0)+1;});});
  const ds=await get(dbRef(db,'dms'));
  if(ds.exists()) ds.forEach(room=>room.child('messages').forEach(c=>{const m=c.val();if(m.uid!==myUid)return;if(m.type==='file'){fileCount++;return;}msgCount++;if(m.ts){const h=new Date(m.ts+28800000).getUTCHours();hourMap[h]=(hourMap[h]||0)+1;}const em=(m.text||'').match(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu)||[];em.forEach(e=>{emojiMap[e]=(emojiMap[e]||0)+1;});}));
  document.getElementById('stat-msg-count').textContent=msgCount;
  document.getElementById('stat-file-count').textContent=fileCount;
  const topH=Object.entries(hourMap).sort((a,b)=>b[1]-a[1]).slice(0,5),maxH=topH[0]?.[1]||1;
  document.getElementById('stat-hours').innerHTML=topH.map(([h,c])=>`<div class="stats-bar-row"><div class="bar-label">${String(h).padStart(2,'0')}:00</div><div class="bar-track"><div class="bar-fill" style="width:${(c/maxH*100).toFixed(0)}%"></div></div><span style="font-size:0.75rem;color:var(--muted);width:24px">${c}</span></div>`).join('')||'<div style="color:var(--muted);font-size:0.8rem">尚無資料</div>';
  const topE=Object.entries(emojiMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  document.getElementById('stat-emojis').innerHTML=topE.map(([e,c])=>`<div class="stats-emoji-item">${e} <span style="color:var(--muted)">${c}</span></div>`).join('')||'<div style="color:var(--muted);font-size:0.8rem">尚無資料</div>';
}

function hideLoading(){if(loadingDone)return;loadingDone=true;const ls=document.getElementById('loading-screen');if(ls){ls.classList.add('hide');setTimeout(()=>ls.remove(),500);}}

function waitForConnectionThenEnter(){
  const connRef=dbRef(db,'.info/connected');
  const unsub=onValue(connRef,snap=>{
    if(!snap.val())return;unsub();hideLoading();
    const saved=localStorage.getItem('chatNick_'+myUid);
    if(saved&&saved.trim()){myNick=saved.trim();enterChat();}
    else{localStorage.removeItem('chatNick_'+myUid);showNickModal();}
  });
  setTimeout(()=>{
    if(!loadingDone){hideLoading();const saved=localStorage.getItem('chatNick_'+myUid);if(saved&&saved.trim()){myNick=saved.trim();enterChat();}else{localStorage.removeItem('chatNick_'+myUid);showNickModal();}}
  },5000);
}

function doUIDMigration(uid){
  const su=localStorage.getItem('savedUid');
  if(su&&su!==uid){
    const on=localStorage.getItem('chatNick_'+su),oc=localStorage.getItem('avatarColor_'+su);
    if(on&&!localStorage.getItem('chatNick_'+uid)) localStorage.setItem('chatNick_'+uid,on);
    if(oc&&!localStorage.getItem('avatarColor_'+uid)) localStorage.setItem('avatarColor_'+uid,oc);
  }
  localStorage.setItem('savedUid',uid);
}

onAuthStateChanged(auth,user=>{
  if(authHandled)return;
  hideLoading();
  if(user&&!user.isAnonymous){
    authHandled=true;myUid=user.uid;isGoogleUser=true;
    if(user.displayName&&!localStorage.getItem('chatNick_'+myUid)) localStorage.setItem('chatNick_'+myUid,user.displayName);
    doUIDMigration(myUid);
    document.getElementById('login-modal').classList.add('hide');
    waitForConnectionThenEnter();
  } else {
    window._pendingAnonUser=user||null;
    document.getElementById('login-modal').classList.remove('hide');
    const btn=document.getElementById('btn-anon-login');
    if(btn) btn.textContent=user?'👤 繼續匿名使用':'👤 匿名訪客進入';
  }
});

document.getElementById('btn-google-login').addEventListener('click',async()=>{
  try{await signInWithPopup(auth,googleProvider);}catch(e){toast('登入失敗：'+e.message);}
});
document.getElementById('btn-anon-login').addEventListener('click',()=>{
  if(window._pendingAnonUser){
    authHandled=true;myUid=window._pendingAnonUser.uid;isGoogleUser=false;
    doUIDMigration(myUid);document.getElementById('login-modal').classList.add('hide');waitForConnectionThenEnter();
  } else {
    signInAnonymously(auth).catch(err=>toast('連線失敗：'+err.message));

});

// ── Notifications ──
function playTone(freq,dur,type='sine',vol=0.3){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=freq;osc.type=type;gain.gain.setValueAtTime(vol,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+dur);}catch(e){}}
function playGlobalBeep(){playTone(660,0.18,'sine',0.2);}
function playDMBeep(){playTone(880,0.12,'sine',0.35);setTimeout(()=>playTone(1100,0.15,'sine',0.35),130);}
const NOTIF_ICON='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#0d1320"/><text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-size="20">💬</text></svg>');
function sendNotif(title,body,isDM=false){
  if(isDM)playDMBeep();else{if(!notifEnabled)return;playGlobalBeep();}
  if(!notifEnabled||document.hasFocus())return;
  try{const n=new Notification(title,{body,icon:NOTIF_ICON,tag:isDM?'chatroom-dm':'chatroom-global',renotify:true});n.onclick=()=>{window.focus();n.close();};setTimeout(()=>n.close(),5000);}catch(e){}
}
function setupNotifications(){
  const btn=document.getElementById('notif-btn');
  if(Notification.permission==='denied'){notifBlocked=true;btn.setAttribute('data-blocked','true');btn.title='通知已被封鎖';return;}
  if(Notification.permission==='granted'){notifEnabled=true;btn.innerHTML='🔔<div class="notif-dot" id="notif-dot"></div>';btn.title='通知已開啟（點擊關閉）';}
  btn.addEventListener('click',async()=>{
    if(notifBlocked)return;
    if(!notifEnabled){const p=await Notification.requestPermission();if(p==='granted'){notifEnabled=true;btn.title='通知已開啟（點擊關閉）';toast('✅ 通知已開啟！');}else if(p==='denied'){notifBlocked=true;btn.setAttribute('data-blocked','true');toast('❌ 通知被封鎖');}}
    else{notifEnabled=false;btn.title='點擊開啟通知';toast('🔕 通知已關閉');}
  });
}

// ── Global Chat ──
function listenGlobal(){
  const mc=document.getElementById('global-messages');
  const q=query(dbRef(db,'global/messages'),limitToLast(MAX_GLOBAL_MSGS));
  onChildAdded(q,snap=>{renderGlobalMsg(snap.val(),mc,snap.key);scrollBottom(mc);});
  // 即時更新收回狀態
  onChildChanged(q,snap=>{
    const msg=snap.val();
    if(!msg.recalled)return;
    const existing=document.querySelector(`[data-msgkey="${snap.key}"]`);
    if(existing){
      const isSelf=msg.uid===myUid;
      const rd=document.createElement('div');rd.className='msg-system';
      rd.textContent=(isSelf?'你':'對方')+' 收回了一則訊息';
      existing.replaceWith(rd);
    }
  });
}
function renderGlobalMsg(msg,container,key){
  if(msg.type==='system'){const d=document.createElement('div');d.className='msg-system';d.textContent=msg.text;container.appendChild(d);return;}
  const isSelf=msg.uid===myUid;
  const div=document.createElement('div');div.className='msg-row '+(isSelf?'self':'other');div.dataset.msgkey=key;
  // 已收回：只顯示提示
  if(msg.recalled){
    const rd=document.createElement('div');rd.className='msg-system';
    rd.textContent=(isSelf?'你':'對方')+' 收回了一則訊息';
    container.appendChild(rd);return;
  }
  if(!isSelf){const av=document.createElement('div');av.className='msg-avatar';av.style.background=avatarColor(msg.uid);av.title='私訊 '+msg.nick;av.textContent=getAvatarText(msg.uid,msg.nick);av.addEventListener('click',()=>openDM(msg.uid,msg.nick));div.appendChild(av);}
  const content=document.createElement('div');content.className='msg-content';
  const meta=document.createElement('div');meta.className='msg-meta';
  if(!isSelf){const a=document.createElement('span');a.className='msg-author';a.style.color=avatarColor(msg.uid);a.style.cursor='pointer';a.textContent=msg.nick;a.addEventListener('click',()=>openDM(msg.uid,msg.nick));meta.appendChild(a);}
  const t=document.createElement('span');t.className='msg-time';t.textContent=formatTime(msg.ts);meta.appendChild(t);content.appendChild(meta);
  if(isSelf&&key&&!msg.recalled){const d=document.createElement('button');d.className='msg-delete';d.title='收回訊息';d.textContent='↩ 收回';d.addEventListener('click',()=>recallMsg('global',key));div.appendChild(d);}
  const b=document.createElement('div');b.className='msg-bubble';b.textContent=msg.text;content.appendChild(b);div.appendChild(content);container.appendChild(div);
  if(!isSelf)sendNotif('💬 大廳',`${msg.nick}：${String(msg.text).slice(0,50)}`);
}
function setupGlobalInput(){
  const input=document.getElementById('global-input'),btn=document.getElementById('global-send');
  btn.addEventListener('click',sendGlobal);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendGlobal();}});
  input.addEventListener('input',()=>{autoResize(input);handleTyping();});
  onValue(dbRef(db,'global/typing'),snap=>{
    const tu=snap.val()||{};
    const names=Object.entries(tu).filter(([u])=>u!==myUid).map(([,n])=>n);
    document.getElementById('global-typing').textContent=names.length?names.join(', ')+' 正在輸入…':'';
  });
}
function handleTyping(){set(dbRef(db,'global/typing/'+myUid),myNick);clearTimeout(typingTimer);typingTimer=setTimeout(()=>remove(dbRef(db,'global/typing/'+myUid)),2000);}
async function recallMsg(type, key, roomId){
  if(!key)return;
  if(!confirm('確定收回這則訊息？'))return;
  // 只標記 recalled:true，原文保留讓管理員後台可以查看
  if(type==='global'){
    await update(dbRef(db,'global/messages/'+key),{recalled:true});
  } else {
    await update(dbRef(db,'dms/'+roomId+'/messages/'+key),{recalled:true});
  }
}
async function sendGlobal(){
  const input=document.getElementById('global-input'),text=input.value.trim();if(!text)return;
  remove(dbRef(db,'global/typing/'+myUid));input.value='';autoResize(input);
  await push(dbRef(db,'global/messages'),{uid:myUid,nick:myNick,text,ts:serverTimestamp()});
  const snap=await get(dbRef(db,'global/messages'));
  if(snap.exists()){const keys=Object.keys(snap.val());if(keys.length>MAX_GLOBAL_MSGS){const upd={};keys.slice(0,keys.length-MAX_GLOBAL_MSGS).forEach(k=>upd['global/messages/'+k]=null);update(dbRef(db),upd);}}
}

// ── DM ──
function openDM(uid,nick){
  if(dmUnsub){dmUnsub();dmUnsub=null;}
  dmUid=uid;dmNick=nick;dmRoomId=makeRoomId(myUid,uid);unreadDM[uid]=0;
  document.getElementById('dm-list-panel').classList.add('hide');
  document.getElementById('panel-dm').classList.add('open');
  if(isMobile()){document.getElementById('panel-right').classList.add('mob-show');document.getElementById('mob-overlay').classList.add('show');['lobby','users','dm'].forEach(t=>document.getElementById('mob-tab-'+t)?.classList.remove('active'));document.getElementById('mob-tab-dm')?.classList.add('active');mobCurrentTab='dm';}
  document.getElementById('dm-with-name').textContent=nick;
  document.getElementById('dm-messages').innerHTML='';
  clearDMConvUnread(uid);
  const badge=document.getElementById('badge-'+uid);if(badge){badge.textContent='';badge.classList.remove('show');}
  document.querySelectorAll('.user-item,.dm-conv-item').forEach(el=>el.classList.remove('active'));
  const mc=document.getElementById('dm-messages');
  const q=query(dbRef(db,'dms/'+dmRoomId+'/messages'),limitToLast(100));
  const unsubAdded=onChildAdded(q,snap=>{renderDMMsg(snap.val(),mc,dmRoomId,snap.key);scrollBottom(mc);});
  const unsubChanged=onChildChanged(dbRef(db,'dms/'+dmRoomId+'/messages'),snap=>{
    const msg=snap.val();
    if(!msg.recalled)return;
    const existing=document.querySelector(`[data-msgkey="${snap.key}"]`);
    if(existing){
      const isSelf=msg.uid===myUid;
      const rd=document.createElement('div');rd.className='msg-system';
      rd.textContent=(isSelf?'你':'對方')+' 收回了一則訊息';
      existing.replaceWith(rd);
    }
  });
  dmUnsub=()=>{unsubAdded();unsubChanged();};
  document.getElementById('dm-send').onclick=sendDM;
  document.getElementById('dm-input').onkeydown=e=>{if(e.key==='Enter')sendDM();};
}
function renderDMMsg(msg,container,roomId,key){
  const isSelf=msg.uid===myUid;
  // 已收回
  if(msg.recalled){
    const rd=document.createElement('div');rd.className='msg-system';
    rd.textContent=(isSelf?'你':'對方')+' 收回了一則訊息';
    container.appendChild(rd);return;
  }
  const div=document.createElement('div');div.className='msg-row '+(isSelf?'self':'other');div.dataset.msgkey=key;
  const avHtml=isSelf?'':`<div class="msg-avatar" style="background:${avatarColor(msg.uid)}">${getAvatarText(msg.uid,msg.nick)}</div>`;
  const nmHtml=isSelf?'':`<span class="msg-author" style="color:${avatarColor(msg.uid)}">${escapeHtml(msg.nick)}</span>`;
  let bubbleHtml;
  if(msg.type==='file'){
    const vUrl=msg.url;
    const dUrl=msg.url.includes('/file/d/')?msg.url.replace(/\/file\/d\/([^/]+)\/.*/,'https://drive.google.com/uc?export=download&id=$1'):msg.url;
    bubbleHtml=`<div class="file-msg"><div class="file-icon">📄</div><div class="file-info"><div class="file-name">${escapeHtml(msg.fileName)}</div><a class="file-dl" href="${vUrl}" target="_blank" rel="noopener">⬇ 開啟</a><a class="file-dl" href="${dUrl}" target="_blank" rel="noopener" style="margin-left:8px;color:var(--accent2)">💾 下載</a></div></div>`;
  } else {
    bubbleHtml=`<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
  }
  div.innerHTML=`${avHtml}<div class="msg-content"><div class="msg-meta">${nmHtml}<span class="msg-time">${formatTime(msg.ts)}</span></div>${bubbleHtml}</div>`;
  // 收回按鈕（自己的訊息才有，非檔案訊息）
  if(isSelf&&roomId&&msg.type!=='file'){
    const d=document.createElement('button');d.className='msg-delete';d.title='收回訊息';d.textContent='↩ 收回';
    d.addEventListener('click',()=>recallMsg('dm',key,roomId));
    div.appendChild(d);
  }
  container.appendChild(div);
  if(!isSelf){
    sendNotif(`📩 私訊：${dmNick||''}`,msg.type==='file'?`傳送了檔案：${msg.fileName}`:String(msg.text).slice(0,50),true);
    if(!document.getElementById('panel-dm').classList.contains('open')||dmUid!==msg.uid){unreadDM[msg.uid]=(unreadDM[msg.uid]||0)+1;const b=document.getElementById('badge-'+msg.uid);if(b){b.textContent=unreadDM[msg.uid];b.classList.add('show');}}
  }
  const preview=msg.type==='file'?`📎 ${msg.fileName}`:msg.text;
  updateDMConv(msg.uid===myUid?dmUid:msg.uid,msg.uid===myUid?dmNick:msg.nick,avatarColor(msg.uid),preview,!isSelf);
  if(!isSelf){wiggleConvItem(msg.uid);if(msg.type==='file')speakFileReceived();}
}
async function sendDM(){
  if(!dmRoomId)return;
  const input=document.getElementById('dm-input'),text=input.value.trim();if(!text)return;
  input.value='';
  await push(dbRef(db,'dms/'+dmRoomId+'/messages'),{uid:myUid,nick:myNick,text,ts:serverTimestamp()});
}

// ── File Upload ──
function checkBeforeUpload(){

  if(!dmRoomId){toast('⚠️ 請先點選對話對象再傳送檔案');return false;}
  return true;
}
function onDriveFileSelected(e){
  const file=e.target.files[0];if(!file)return;e.target.value='';
  if(file.size>MAX_FILE_MB*1024*1024){toast(`❌ 檔案太大，上限 ${MAX_FILE_MB}MB`);return;}
  document.getElementById('file-preview-name').textContent='📄 '+file.name;
  uploadViaAppsScript(file);
}
async function uploadViaAppsScript(file){
  const btn=document.getElementById('dm-send'),pb=document.getElementById('upload-progress-bar'),fill=document.getElementById('upload-fill');
  btn.disabled=true;pb.style.display='block';fill.style.width='10%';
  try{
    const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    fill.style.width='40%';
    const resp=await fetch(APPS_SCRIPT_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'upload',fileName:`${Date.now()}_${file.name}`,fileData:base64,mimeType:file.type||'application/octet-stream'})});
    fill.style.width='80%';
    const result=await resp.json();
    if(!result.ok)throw new Error(result.error||'上傳失敗');
    const finalUrl=result.viewUrl||result.downloadUrl;
    await push(dbRef(db,'dms/'+dmRoomId+'/messages'),{uid:myUid,nick:myNick,type:'file',fileName:file.name,url:finalUrl,fileId:result.fileId,fileSize:file.size,ts:serverTimestamp()});
    await addUpload(file.size);
    fill.style.width='100%';toast('✅ 檔案傳送成功！');
    document.getElementById('file-preview-name').textContent='';
  }catch(err){console.error(err);toast('❌ 上傳失敗：'+err.message);document.getElementById('file-preview-name').textContent='';}
  finally{btn.disabled=false;setTimeout(()=>{pb.style.display='none';fill.style.width='0%';},800);}
}
function setupDriveUpload(){const i=document.getElementById('dm-file-input');if(i)i.addEventListener('change',onDriveFileSelected);}

// ── Close DM ──
document.getElementById('close-dm').addEventListener('click',()=>{
  document.getElementById('panel-dm').classList.remove('open');
  document.getElementById('dm-list-panel').classList.remove('hide');
  if(isMobile())document.getElementById('panel-right').classList.add('mob-show');
  if(dmUnsub){dmUnsub();dmUnsub=null;}
  dmUid=null;dmNick=null;dmRoomId=null;
  renderDMConvList();
  document.querySelectorAll('.user-item').forEach(el=>el.classList.remove('active'));
});

// ── Mobile Nav ──
function mobTab(tab){
  if(!isMobile())return;mobCurrentTab=tab;
  const L=document.getElementById('panel-left'),R=document.getElementById('panel-right'),O=document.getElementById('mob-overlay');
  L.classList.remove('mob-show');R.classList.remove('mob-show');O.classList.remove('show');
  ['lobby','users','dm'].forEach(t=>document.getElementById('mob-tab-'+t)?.classList.remove('active'));
  document.getElementById('mob-tab-'+tab)?.classList.add('active');
  if(tab==='users'){L.classList.add('mob-show');O.classList.add('show');document.getElementById('mob-badge-users')?.classList.remove('show');}
  else if(tab==='dm'){R.classList.add('mob-show');O.classList.add('show');document.getElementById('mob-badge-dm')?.classList.remove('show');}
}
function bindMobNav(){
  ['lobby','users','dm'].forEach(tab=>{
    const btn=document.getElementById('mob-tab-'+tab);if(!btn)return;
    btn.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();mobTab(tab);},{passive:false});
    btn.addEventListener('click',e=>{if(e.detail===0)return;mobTab(tab);});
  });
  const O=document.getElementById('mob-overlay');
  O.addEventListener('touchend',e=>{e.preventDefault();mobTab('lobby');},{passive:false});
  O.addEventListener('click',()=>mobTab('lobby'));
}
function updateMobDMBadge(n){const b=document.getElementById('mob-badge-dm');if(!b)return;if(n>0&&mobCurrentTab!=='dm'){b.textContent=n>9?'9+':n;b.classList.add('show');}else b.classList.remove('show');}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&myUid)set(dbRef(db,'presence/'+myUid),{nick:myNick,uid:myUid,color:avatarColor(myUid),ts:serverTimestamp()});});
const hb=document.getElementById('hamburger');if(hb)hb.addEventListener('click',()=>document.getElementById('panel-left').classList.toggle('mob-show'));

</script>
