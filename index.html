<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ── RESET & VARIABLES ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080c14;
  --bg2: #0d1320;
  --bg3: #111827;
  --border: rgba(255,255,255,0.07);
  --accent: #22d3ee;
  --accent2: #818cf8;
  --danger: #f87171;
  --text: #e2e8f0;
  --muted: #64748b;
  --online: #34d399;
  --msg-self: #1e3a5f;
  --msg-other: #1a1f2e;
  --panel-w: 240px;
  --dm-w: 320px;
}

html, body { height: 100%; overflow: hidden; overscroll-behavior-y: contain; }
@media (max-width: 768px) { html, body { overflow: auto; overscroll-behavior-y: auto; } }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── LOADING SCREEN ── */
#loading-screen {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  transition: opacity 0.5s;
}
#loading-screen.hide { opacity: 0; pointer-events: none; }
.loader-logo {
  font-family: 'Syne', sans-serif;
  font-size: 2.5rem; font-weight: 800;
  letter-spacing: -2px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.loader-bar {
  width: 200px; height: 2px;
  background: var(--border);
  border-radius: 99px; overflow: hidden;
}
.loader-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  animation: load 1.5s ease-in-out forwards;
}
@keyframes load { from { width: 0; } to { width: 100%; } }

/* ── NICKNAME MODAL ── */
#nick-modal {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
}
#nick-modal.hide { display: none; }
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  width: 340px;
  box-shadow: 0 0 60px rgba(34,211,238,0.08);
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem; font-weight: 700;
  margin-bottom: 6px;
}
.modal-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
.modal-input {
  width: 100%; padding: 10px 14px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 0.95rem; font-family: inherit;
  outline: none; transition: border-color 0.2s;
  margin-bottom: 12px;
}
.modal-input:focus { border-color: var(--accent); }
.btn-enter {
  width: 100%; padding: 10px;
  background: var(--accent); color: #000;
  font-weight: 700; font-family: 'Syne', sans-serif;
  font-size: 0.95rem; letter-spacing: 0.5px;
  border: none; border-radius: 8px;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-enter:hover { opacity: 0.85; }

/* ── APP SHELL ── */
#app { display: flex; height: 100vh; }

/* ── LEFT PANEL ── */
#panel-left {
  width: var(--panel-w);
  min-width: var(--panel-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.panel-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 1.1rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.panel-section {
  padding: 10px 14px 4px;
  font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase;
}
.user-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.user-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px; border-radius: 8px;
  cursor: pointer; transition: background 0.15s;
  position: relative;
}
.user-item:hover { background: rgba(255,255,255,0.04); }
.user-item.active { background: rgba(34,211,238,0.08); }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  position: relative;
}
.avatar-dot {
  position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px;
  background: var(--online); border-radius: 50%;
  border: 2px solid var(--bg2);
}
.user-name {
  font-size: 0.85rem; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-name.you { color: var(--accent); }
.dm-badge {
  margin-left: auto; background: var(--accent);
  color: #000; font-size: 0.65rem; font-weight: 700;
  padding: 1px 6px; border-radius: 99px; min-width: 18px;
  text-align: center; display: none;
}
.dm-badge.show { display: block; }
.my-info {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.my-name { font-size: 0.85rem; font-weight: 500; }
.my-status { font-size: 0.72rem; color: var(--online); }

/* ── MAIN CHAT ── */
#main-chat {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
}
.chat-topbar {
  padding: 0 20px;
  height: 56px; min-height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.chat-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 1rem;
}
.online-count {
  font-size: 0.8rem; color: var(--muted);
}
.online-count span { color: var(--online); font-weight: 600; }

.messages {
  flex: 1; overflow-y: auto;
  padding: 16px 20px;
  display: flex; flex-direction: column; gap: 4px;
}
.msg-group { margin-bottom: 8px; }
/* ── LINE-STYLE MESSAGES ── */
.msg-row {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 10px;
  max-width: 80%;
}
.msg-row.self {
  flex-direction: row-reverse;
  margin-left: auto;
}
.msg-row.other {
  margin-right: auto;
}
.msg-avatar {
  width: 34px; height: 34px; min-width: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.8rem;
  flex-shrink: 0;
  align-self: flex-end;
  transition: transform 0.15s, box-shadow 0.15s;
}
.msg-avatar:hover {
  transform: scale(1.12);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
}
.msg-content { display: flex; flex-direction: column; gap: 3px; }
.msg-row.self .msg-content { align-items: flex-end; }
.msg-row.other .msg-content { align-items: flex-start; }

.msg-meta {
  display: flex; align-items: baseline; gap: 6px;
  padding: 0 4px;
}
.msg-row.self .msg-meta { flex-direction: row-reverse; }
.msg-author { font-size: 0.75rem; font-weight: 600; }
.msg-time { font-size: 0.68rem; color: var(--muted); }

.msg-bubble {
  display: inline-block;
  padding: 9px 13px;
  border-radius: 18px;
  font-size: 0.875rem; line-height: 1.55;
  max-width: 100%; word-break: break-word;
}
.msg-row.other .msg-bubble {
  background: var(--msg-other);
  border-bottom-left-radius: 4px;
}
.msg-row.self .msg-bubble {
  background: var(--accent);
  color: #000;
  border-bottom-right-radius: 4px;
}

/* System messages */
.msg-system {
  text-align: center; font-size: 0.75rem;
  color: var(--muted); padding: 4px 0;
}

.chat-input-bar {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
}
.chat-input {
  flex: 1; padding: 10px 14px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 0.9rem; font-family: inherit;
  outline: none; transition: border-color 0.2s;
  resize: none; max-height: 120px;
}
.chat-input:focus { border-color: var(--accent); }
.btn-send {
  padding: 0 18px; height: 40px;
  background: var(--accent); color: #000;
  font-weight: 700; font-size: 0.85rem;
  font-family: 'Syne', sans-serif;
  border: none; border-radius: 8px;
  cursor: pointer; transition: opacity 0.2s;
  white-space: nowrap;
}
.btn-send:hover { opacity: 0.85; }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }


/* ── DM CONVERSATION LIST ── */
.dm-list-header {
  padding: 0 16px;
  height: 56px; min-height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 0.95rem;
}
.dm-conv-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; cursor: pointer;
  transition: background 0.15s;
  border-radius: 10px; margin: 2px 8px;
  position: relative;
}
.dm-conv-item:hover { background: rgba(255,255,255,0.05); }
.dm-conv-item.active { background: rgba(34,211,238,0.08); }
.dm-conv-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
  position: relative;
}
.dm-conv-avatar .unread-ring {
  position: absolute; inset: -3px;
  border: 2px solid var(--accent);
  border-radius: 50%; display: none;
}
.dm-conv-avatar .unread-ring.show { display: block; }
.dm-conv-info { flex: 1; min-width: 0; }
.dm-conv-name { font-size: 0.85rem; font-weight: 600; }
.dm-conv-preview {
  font-size: 0.75rem; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 2px;
}
.dm-conv-preview.unread { color: var(--accent); font-weight: 500; }
.dm-conv-meta {
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
}
.dm-conv-time { font-size: 0.68rem; color: var(--muted); }
.dm-conv-badge {
  background: var(--accent); color: #000;
  font-size: 0.65rem; font-weight: 700;
  padding: 1px 6px; border-radius: 99px;
  min-width: 18px; text-align: center; display: none;
}
.dm-conv-badge.show { display: block; }

/* 抖動動畫：有新訊息時 */
@keyframes wiggle {
  0%,100% { transform: rotate(0); }
  20% { transform: rotate(-8deg); }
  40% { transform: rotate(8deg); }
  60% { transform: rotate(-5deg); }
  80% { transform: rotate(5deg); }
}
.dm-conv-item.new-msg .dm-conv-avatar { animation: wiggle 0.5s ease; }

/* ── DM PANEL ── */
/* 右側容器：永遠顯示，寬度固定 */
#panel-right {
  width: var(--dm-w);
  min-width: var(--dm-w);
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* 對話列表（預設顯示） */
#dm-list-panel {
  display: flex; flex-direction: column;
  height: 100%; overflow: hidden;
}
#dm-list-panel.hide { display: none; }

/* 聊天視窗（點進去後顯示） */
#panel-dm {
  display: none; flex-direction: column;
  height: 100%; overflow: hidden;
  position: relative;
}
#panel-dm.open { display: flex; }

.dm-topbar {
  padding: 0 16px;
  height: 56px; min-height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.dm-with {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 0.95rem;
}
.dm-with span { color: var(--accent); }
.btn-close-dm {
  background: none; border: none;
  color: var(--muted); cursor: pointer; font-size: 1.1rem;
  padding: 4px; border-radius: 4px;
  transition: color 0.2s;
}
.btn-close-dm:hover { color: var(--text); }

.dm-messages {
  flex: 1; overflow-y: auto;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px;
}

.dm-input-area {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.dm-file-row {
  display: flex; align-items: center; gap: 8px;
}
.btn-file {
  padding: 7px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; color: var(--muted);
  font-size: 0.8rem; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.btn-file:hover { border-color: var(--accent2); color: var(--accent2); }
#dm-file-input { display: none; }
.file-preview {
  font-size: 0.75rem; color: var(--accent2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.dm-msg-row {
  display: flex; align-items: center; gap: 6px;
}
.dm-input {
  flex: 1; padding: 8px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-size: 0.85rem; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.dm-input:focus { border-color: var(--accent); }
.btn-dm-send {
  padding: 0 14px; height: 36px;
  background: var(--accent2); color: #fff;
  font-weight: 700; font-size: 0.8rem;
  font-family: 'Syne', sans-serif;
  border: none; border-radius: 7px;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-dm-send:hover { opacity: 0.85; }
.btn-dm-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* File message */
.file-msg {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  max-width: 220px;
}
.file-icon { font-size: 1.3rem; }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-dl { font-size: 0.72rem; color: var(--accent); cursor: pointer; }
.file-dl:hover { text-decoration: underline; }

/* Upload progress */
.upload-bar {
  height: 2px; background: var(--border); border-radius: 99px; overflow: hidden;
  margin-top: 4px;
}
.upload-fill {
  height: 100%; background: var(--accent2);
  border-radius: 99px; transition: width 0.2s;
}



/* ── EMOJI PICKER ── */
.emoji-btn {
  background: none; border: none; cursor: pointer;
  font-size: 1.15rem; padding: 5px 7px;
  border-radius: 7px; color: var(--muted);
  transition: background 0.15s, transform 0.1s;
  flex-shrink: 0; line-height: 1;
}
.emoji-btn:hover { background: rgba(255,255,255,0.07); transform: scale(1.15); }

.emoji-panel {
  position: absolute; bottom: calc(100% + 8px);
  left: 0; right: 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 80;
  display: none;
  flex-direction: column;
  overflow: hidden;
  max-height: 280px;
}
.emoji-panel.open { display: flex; }

.emoji-tabs {
  display: flex; gap: 2px;
  padding: 8px 10px 4px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
}
.emoji-tabs::-webkit-scrollbar { height: 3px; }
.emoji-tab {
  background: none; border: none; cursor: pointer;
  font-size: 0.72rem; padding: 4px 10px;
  border-radius: 6px; color: var(--muted);
  white-space: nowrap; font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
.emoji-tab:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.emoji-tab.active { background: rgba(34,211,238,0.12); color: var(--accent); }

.emoji-search {
  margin: 8px 10px 4px;
  padding: 6px 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-size: 0.82rem; font-family: inherit;
  outline: none; flex-shrink: 0;
}
.emoji-search:focus { border-color: var(--accent); }

.emoji-grid {
  display: flex; flex-wrap: wrap;
  padding: 6px 8px 10px;
  gap: 2px; overflow-y: auto; flex: 1;
}
.emoji-item {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; border-radius: 7px;
  cursor: pointer; transition: background 0.1s, transform 0.1s;
  user-select: none;
}
.emoji-item:hover { background: rgba(255,255,255,0.08); transform: scale(1.2); }
.emoji-item.kaomoji { font-size: 0.72rem; width: auto; padding: 4px 8px; }

/* ── NOTIFICATION BELL ── */
.notif-dot {
  position: absolute; top: 2px; right: 2px;
  width: 8px; height: 8px;
  background: var(--danger); border-radius: 50%;
  border: 2px solid var(--bg2);
  display: none;
}
.notif-dot.show { display: block; }
#notif-btn {
  background: none; border: none; cursor: pointer;
  font-size: 1.1rem; position: relative;
  padding: 4px 8px; border-radius: 6px;
  transition: background 0.15s;
}
#notif-btn:hover { background: rgba(255,255,255,0.06); }
#notif-btn[data-blocked="true"] { opacity: 0.4; cursor: not-allowed; }

/* ── NOTIFICATION TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--bg2); border: 1px solid var(--border);
  padding: 10px 18px; border-radius: 8px;
  font-size: 0.85rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── MOBILE OVERLAY ── */
/* ── MOBILE NAV BAR (bottom tabs) ── */
#mob-nav {
  display: none;  /* 桌機隱藏 */
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 56px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  align-items: center; justify-content: space-around;
  z-index: 9999;  /* 永遠在最上層 */
  -webkit-tap-highlight-color: transparent;
}
#mob-nav button {
  flex: 1; height: 100%;
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--muted); font-size: 0.6rem;
  font-family: inherit; transition: color 0.15s;
  position: relative;
}
#mob-nav button.active { color: var(--accent); }
#mob-nav button .nav-icon { font-size: 1.3rem; line-height: 1; }
#mob-nav button .nav-badge {
  position: absolute; top: 6px; right: calc(50% - 16px);
  background: var(--danger); color: #fff;
  font-size: 0.6rem; font-weight: 700;
  padding: 1px 5px; border-radius: 99px;
  display: none;
}
#mob-nav button .nav-badge.show { display: block; }

/* ── MOBILE OVERLAY (dim behind panels) ── */
#mob-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 55;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
}
#mob-overlay.show { display: block; }

.hamburger {
  display: none; flex-direction: column; gap: 4px;
  background: none; border: none; cursor: pointer; padding: 4px;
}
.hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }

@media (max-width: 768px) {
  .hamburger { display: none !important; }

  /* ── 底部導覽列 ── */
  #mob-nav {
    display: flex !important;
    z-index: 9999 !important;
  }

  /* ── overlay ── */
  #mob-overlay {
    z-index: 8000;
    touch-action: none;
  }

  /* ── 左右面板 ── */
  #panel-left {
    position: fixed; left: 0; top: 0; bottom: 56px;
    z-index: 8500;
    width: 82vw; min-width: unset; max-width: 320px;
    transform: translateX(-105%);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 4px 0 30px rgba(0,0,0,0.6);
    overflow-y: auto;
  }
  #panel-left.mob-show { transform: translateX(0); }

  #panel-right {
    position: fixed; right: 0; top: 0; bottom: 56px;

  // 即時監聽別人上傳/下載也會更新 UI
  onValue(dbRef(db, `quota/${dk}/upload`),   s => { todayUploadBytes   = s.exists() ? s.val() : 0; updateQuotaUI(); });
  onValue(dbRef(db, `quota/${dk}/download`), s => { todayDownloadBytes = s.exists() ? s.val() : 0; updateQuotaUI(); });
}

async function addUpload(bytes) {
  todayUploadBytes += bytes;
  await set(dbRef(db, `quota/${dateKey()}/upload`), todayUploadBytes);
  updateQuotaUI();
}

async function addDownload(bytes) {
  todayDownloadBytes += bytes;
  await set(dbRef(db, `quota/${dateKey()}/download`), todayDownloadBytes);
  updateQuotaUI();
}

function updateQuotaUI() {
  const upPct = Math.min((todayUploadBytes   / UPLOAD_LIMIT_BYTES)   * 100, 100);
  const dlPct = Math.min((todayDownloadBytes / DOWNLOAD_LIMIT_BYTES) * 100, 100);

  const upFill = document.getElementById('upload-bar-fill');
  const dlFill = document.getElementById('download-bar-fill');
  const upLabel = document.getElementById('upload-label');
  const dlLabel = document.getElementById('download-label');

  if (upFill) { upFill.style.width = upPct + '%'; upFill.style.background = barColor(upPct); }
  if (dlFill) { dlFill.style.width = dlPct + '%'; dlFill.style.background = barColor(dlPct); }
  if (upLabel) upLabel.textContent = `${fmtBytes(todayUploadBytes)} / ${UPLOAD_LIMIT_GB} GB`;
  if (dlLabel) dlLabel.textContent = `${fmtBytes(todayDownloadBytes)} / ${DOWNLOAD_LIMIT_GB} GB`;

  // 上傳警示（不鎖定，只提示）
  const uploadLocked = todayUploadBytes >= UPLOAD_LIMIT_BYTES;
  const fileBtn = document.querySelector('.btn-file');
  if (fileBtn && uploadLocked) {
    fileBtn.title = '今日上傳量較高，請注意 Google Drive 空間';
  }
}

function isQuotaExceeded() {
  return todayUploadBytes >= UPLOAD_LIMIT_BYTES;
}


// 下載時追蹤用量
function trackDownloadAndOpen(url, fileSize) {
  window.open(url, '_blank', 'noopener');
  if (fileSize > 0) {
    addDownload(fileSize);
  }
}

//  🕐 TOPBAR CLOCK (Taiwan Time UTC+8)
// ════════════════════════════════════════════════════
const WEEKDAYS = ['日','一','二','三','四','五','六'];

function updateClock() {
  const el = document.getElementById('topbar-clock');
  if (!el) return;
  const now = new Date(Date.now() + 8 * 60 * 60 * 1000); // UTC+8
  const Y = now.getUTCFullYear();
  const M = String(now.getUTCMonth() + 1).padStart(2, '0');
  const D = String(now.getUTCDate()).padStart(2, '0');
  const wd = WEEKDAYS[now.getUTCDay()];
  const h = String(now.getUTCHours()).padStart(2, '0');
  const m = String(now.getUTCMinutes()).padStart(2, '0');
  const s = String(now.getUTCSeconds()).padStart(2, '0');
  el.innerHTML = `<span style="color:var(--text);font-weight:600">${Y}/${M}/${D}</span> <span style="color:var(--accent);font-size:0.75rem">(${wd})</span><br><span style="color:var(--text);font-weight:700;font-size:0.9rem;letter-spacing:1px">${h}:${m}:${s}</span>`;
}

function startClock() {
  updateClock();
  // 對齊整秒再開始
  const msToNext = 1000 - (Date.now() % 1000);
  setTimeout(() => {
    updateClock();
    setInterval(updateClock, 1000);
  }, msToNext);
}

function getDMConvs() {
  try { return JSON.parse(localStorage.getItem('dmConvs_v2') || '{}'); }
  catch { return {}; }
}
function saveDMConvs(convs) {
  localStorage.setItem('dmConvs_v2', JSON.stringify(convs));
}
function updateDMConv(uid, nick, color, lastMsg, isIncoming) {
  const convs = getDMConvs();
  const prev = convs[uid] || {};
  convs[uid] = {
    nick, color,
    lastMsg: String(lastMsg).slice(0, 60),
    lastTs: Date.now(),
    unread: isIncoming ? (prev.unread || 0) + 1 : (prev.unread || 0)
  };
  saveDMConvs(convs);
  renderDMConvList();
}
function clearDMConvUnread(uid) {
  const convs = getDMConvs();
  if (convs[uid]) { convs[uid].unread = 0; saveDMConvs(convs); }
  renderDMConvList();
}

function renderDMConvList() {
  const list = document.getElementById('dm-conv-list');
  if (!list) return;
  const convs = getDMConvs();
  const sorted = Object.entries(convs).sort((a,b) => (b[1].lastTs||0) - (a[1].lastTs||0));
  list.innerHTML = '';
  if (sorted.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:0.8rem;padding:20px">還沒有私訊紀錄</div>';
    return;
  }
  // 計算總未讀數，更新手機底部 badge
  const totalUnread = sorted.reduce((sum, [uid, info]) => sum + (uid !== dmUid ? (info.unread || 0) : 0), 0);
  updateMobDMBadge(totalUnread);

  sorted.forEach(([uid, info]) => {
    const item = document.createElement('div');
    item.className = 'dm-conv-item' + (uid === dmUid ? ' active' : '');
    item.dataset.uid = uid;
    const hasUnread = info.unread > 0 && uid !== dmUid;
    item.innerHTML = `
      <div class="dm-conv-avatar" style="background:${info.color || '#3b82f6'}">
        ${initials(info.nick)}
        <div class="unread-ring ${hasUnread ? 'show' : ''}"></div>
      </div>
      <div class="dm-conv-info">
        <div class="dm-conv-name">${escapeHtml(info.nick)}</div>
        <div class="dm-conv-preview ${hasUnread ? 'unread' : ''}">${escapeHtml(info.lastMsg || '')}</div>
      </div>
      <div class="dm-conv-meta">
        <div class="dm-conv-time">${info.lastTs ? formatTime(info.lastTs) : ''}</div>
        <div class="dm-conv-badge ${hasUnread ? 'show' : ''}">${info.unread || ''}</div>
      </div>
    `;
    item.addEventListener('click', () => openDM(uid, info.nick));
    list.appendChild(item);
  });
}

//  ✏️ RENAME: 更新已存在的訊息 nick 欄位
// ════════════════════════════════════════════════════
async function renameInDB(oldNick, newNick) {
  if (oldNick === newNick) return;
  toast('⏳ 更新舊訊息中…');
  const updates = {};
  let count = 0;

  // 大廳
  const globalSnap = await get(dbRef(db, 'global/messages'));
  if (globalSnap.exists()) {
    globalSnap.forEach(child => {
      if (child.val().uid === myUid) {
        updates['global/messages/' + child.key + '/nick'] = newNick;
        count++;
      }
    });
  }

  // 私訊（掃描所有 DM room）
  const dmsSnap = await get(dbRef(db, 'dms'));
  if (dmsSnap.exists()) {
    dmsSnap.forEach(room => {
      const msgs = room.child('messages');
      msgs.forEach(child => {
        if (child.val().uid === myUid) {
          updates['dms/' + room.key + '/messages/' + child.key + '/nick'] = newNick;
          count++;
        }
      });
    });
  }

  if (Object.keys(updates).length > 0) {
    await update(dbRef(db), updates);
  }
  toast(`✅ 暱稱已更新，共修改 ${count} 則訊息`);
}

let activeEmojiTarget = null;  // 'global' or 'dm'
let activeEmojiTab = '笑臉';

function buildEmojiPanel(panelId, targetInputId) {
  const panel = document.getElementById(panelId);
  panel.innerHTML = '';

  // Search bar
  const search = document.createElement('input');
  search.className = 'emoji-search';
  search.placeholder = '搜尋…';
  panel.appendChild(search);

  // Tabs
  const tabs = document.createElement('div');
  tabs.className = 'emoji-tabs';
  Object.keys(EMOJI_DATA).forEach(cat => {
    const tab = document.createElement('button');
    tab.className = 'emoji-tab' + (cat === activeEmojiTab ? ' active' : '');
    tab.textContent = cat;
    tab.addEventListener('click', () => {
      tabs.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeEmojiTab = cat;
      renderGrid(cat);
    });
    tabs.appendChild(tab);
  });
  panel.appendChild(tabs);

  // Grid
  const grid = document.createElement('div');
  grid.className = 'emoji-grid';
  panel.appendChild(grid);

  function renderGrid(cat, filter = '') {
    grid.innerHTML = '';
    const items = filter
      ? Object.values(EMOJI_DATA).flat().filter(e => e.includes(filter))
      : EMOJI_DATA[cat] || [];
    items.forEach(em => {
      const el = document.createElement('div');
      const isKao = em.length > 2 && !em.match(/\p{Emoji}/u);
      el.className = 'emoji-item' + (isKao ? ' kaomoji' : '');
      el.textContent = em;
      el.title = em;
      el.addEventListener('click', () => {
        insertEmoji(targetInputId, em);
      });
      grid.appendChild(el);
    });
  }

  renderGrid(activeEmojiTab);

  search.addEventListener('input', () => {
    const q = search.value.trim();
    if (q) {
      renderGrid(null, q);
    } else {
      renderGrid(activeEmojiTab);
    }
  });
}

function insertEmoji(targetId, emoji) {
  const input = document.getElementById(targetId);
  if (!input) return;
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
  const pos = start + emoji.length;
  input.setSelectionRange(pos, pos);
  input.focus();
  // trigger autoResize for textarea
  if (input.tagName === 'TEXTAREA') autoResize(input);
}

function toggleEmojiPanel(panelId, targetId) {
  // close any other open panel first
  document.querySelectorAll('.emoji-panel').forEach(p => {
    if (p.id !== panelId) p.classList.remove('open');
  });
  const panel = document.getElementById(panelId);
  const isOpen = panel.classList.contains('open');
  if (!isOpen) {
    buildEmojiPanel(panelId, targetId);
    panel.classList.add('open');
    // focus search
    setTimeout(() => panel.querySelector('.emoji-search')?.focus(), 50);
  } else {
    panel.classList.remove('open');
  }
}

async function openStats() {

    return;
  }
  document.getElementById('stats-modal').classList.add('show');
  await loadStats();

function closeStats() {
  document.getElementById('stats-modal').classList.remove('show');

async function loadStats() {
  let msgCount = 0, fileCount = 0;
  const hourMap = {}; // 0~23
  const emojiMap = {};

  // 掃大廳訊息
  const globalSnap = await get(dbRef(db, 'global/messages'));
  if (globalSnap.exists()) {
    globalSnap.forEach(child => {
      const m = child.val();
      if (m.uid !== myUid) return;
      if (m.type === 'file') { fileCount++; return; }
      msgCount++;
      // 時段
      if (m.ts) {
        const h = new Date(m.ts + 8*60*60*1000).getUTCHours(); // TWN
        hourMap[h] = (hourMap[h] || 0) + 1;
      }
      // 表情符號（掃訊息裡的 emoji）
      const emojis = (m.text || '').match(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu) || [];
      emojis.forEach(e => { emojiMap[e] = (emojiMap[e] || 0) + 1; });
    });
  }

  // 掃私訊
  const dmsSnap = await get(dbRef(db, 'dms'));
  if (dmsSnap.exists()) {
    dmsSnap.forEach(room => {
      room.child('messages').forEach(child => {
        const m = child.val();
        if (m.uid !== myUid) return;
        if (m.type === 'file') { fileCount++; return; }
        msgCount++;
        if (m.ts) {
          const h = new Date(m.ts + 8*60*60*1000).getUTCHours();
          hourMap[h] = (hourMap[h] || 0) + 1;
        }
        const emojis = (m.text || '').match(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu) || [];
        emojis.forEach(e => { emojiMap[e] = (emojiMap[e] || 0) + 1; });
      });
    });
  }

  // 更新 UI
  document.getElementById('stat-msg-count').textContent = msgCount;
  document.getElementById('stat-file-count').textContent = fileCount;

  // 時段圖表（顯示前 5 名）
  const topHours = Object.entries(hourMap).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxH = topHours[0]?.[1] || 1;
  document.getElementById('stat-hours').innerHTML = topHours.map(([h, cnt]) => `
    <div class="stats-bar-row">
      <div class="bar-label">${String(h).padStart(2,'0')}:00</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(cnt/maxH*100).toFixed(0)}%"></div></div>
      <span style="font-size:0.75rem;color:var(--muted);width:24px">${cnt}</span>
    </div>`).join('') || '<div style="color:var(--muted);font-size:0.8rem">尚無資料</div>';

  // 表情符號（前 8 名）
  const topEmojis = Object.entries(emojiMap).sort((a,b) => b[1]-a[1]).slice(0,8);
  document.getElementById('stat-emojis').innerHTML = topEmojis.map(([e, cnt]) =>
    `<div class="stats-emoji-item">${e} <span style="color:var(--muted)">${cnt}</span></div>`
  ).join('') || '<div style="color:var(--muted);font-size:0.8rem">尚無資料</div>';
}

let loadingDone = false;
function hideLoading() {

// ── AUTH 流程 ──
// 策略：一律等 Firebase DB 真正連線（.info/connected = true）後才進入聊天室
// 這樣無論是第一次訪問還是有 session，都能確保連線穩定再 enterChat()
let authHandled = false;

function waitForConnectionThenEnter() {
  // 等 Firebase Realtime DB 確認連線後才繼續
  const connRef = dbRef(db, '.info/connected');
  const unsub = onValue(connRef, (snap) => {
    if (!snap.val()) return;   // 還沒連上，等下一次觸發
    unsub();                   // 連上了，取消監聽
    hideLoading();
    const savedNick = localStorage.getItem('chatNick_' + myUid);
    if (savedNick && savedNick.trim()) {
      myNick = savedNick.trim();
      enterChat();
    } else {
      // 清掉可能殘留的空字串
      localStorage.removeItem('chatNick_' + myUid);
      showNickModal();
    }
  });

  // 保底：5 秒內沒連上就還是顯示（避免卡住）
  setTimeout(() => {
    if (!loadingDone) {
      hideLoading();
      const savedNick = localStorage.getItem('chatNick_' + myUid);
      if (savedNick && savedNick.trim()) {
        myNick = savedNick.trim();
        enterChat();
      } else {
        localStorage.removeItem('chatNick_' + myUid);
        showNickModal();
      }
    }
  }, 5000);
}

function doUIDMigration(uid) {
  const savedUid = localStorage.getItem('savedUid');
  if (savedUid && savedUid !== uid) {
    const oldNick  = localStorage.getItem('chatNick_' + savedUid);
    const oldColor = localStorage.getItem('avatarColor_' + savedUid);
    if (oldNick && !localStorage.getItem('chatNick_' + uid))

    if (oldColor && !localStorage.getItem('avatarColor_' + uid))
      localStorage.setItem('avatarColor_' + uid, oldColor);

}

let notifEnabled = false;
let notifBlocked = false;

// ── 音效：用 Web Audio API 合成，不需要音訊檔案 ──
function playTone(freq, duration, type = 'sine', volume = 0.3) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

// 大廳：輕柔單音
function playGlobalBeep() {
  playTone(660, 0.18, 'sine', 0.2);
}

// 私訊：雙音急促，更顯眼
function playDMBeep() {
  playTone(880, 0.12, 'sine', 0.35);
  setTimeout(() => playTone(1100, 0.15, 'sine', 0.35), 130);
}

// 通知圖示 SVG (base64-safe)
const NOTIF_ICON = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#0d1320"/><text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-size="20">💬</text></svg>');

function sendNotif(title, body, isDM = false) {
  // 不管有沒有開通知，私訊都要響聲
  if (isDM) {
    playDMBeep();
  } else {
    if (!notifEnabled) return;
    playGlobalBeep();
  }

  if (!notifEnabled) return;
  if (document.hasFocus()) return;   // 視窗在前景只響聲，不跳泡泡

  try {
    const n = new Notification(title, {
      body,
      icon: NOTIF_ICON,
      tag: isDM ? 'chatroom-dm' : 'chatroom-global',  // 私訊/大廳分開 tag
      renotify: true
    });
    n.onclick = () => { window.focus(); n.close(); };
    setTimeout(() => n.close(), 5000);
  } catch(e) {}
}

function setupNotifications() {
  const btn = document.getElementById('notif-btn');
  // 檢查是否已被封鎖
  if (Notification.permission === 'denied') {
    notifBlocked = true;
    btn.setAttribute('data-blocked', 'true');
    btn.title = '通知已被封鎖，請在瀏覽器設定中允許';
    return;
  }
  if (Notification.permission === 'granted') {
    notifEnabled = true;
    btn.textContent = '';
    btn.innerHTML = '🔔<div class="notif-dot" id="notif-dot"></div>';
    btn.title = '通知已開啟（點擊關閉）';
  }
  btn.addEventListener('click', async () => {
    if (notifBlocked) return;
    if (!notifEnabled) {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        notifEnabled = true;
        btn.title = '通知已開啟（點擊關閉）';
        toast('✅ 通知已開啟！');
      } else if (perm === 'denied') {
        notifBlocked = true;
        btn.setAttribute('data-blocked', 'true');
        btn.title = '通知已被封鎖，請在瀏覽器設定中允許';
        toast('❌ 通知被封鎖，請在瀏覽器設定允許');
      }
    } else {
      notifEnabled = false;
      btn.title = '點擊開啟通知';
      toast('🔕 通知已關閉');
    }
  });
}

function renderGlobalMsg(msg, container, snap_key) {

    container.appendChild(div);
    return;
  }
  const isSelf = msg.uid === myUid;
  const div = document.createElement('div');
  div.className = 'msg-row ' + (isSelf ? 'self' : 'other');

  if (!isSelf) {
    // 頭像：用 DOM 建立才能綁 click 事件
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.style.background = avatarColor(msg.uid);
    av.style.cursor = 'pointer';
    av.title = `私訊 ${msg.nick}`;
    av.textContent = initials(msg.nick);
    av.addEventListener('click', () => openDM(msg.uid, msg.nick));
    div.appendChild(av);
  }

  // 訊息內容
  const content = document.createElement('div');
  content.className = 'msg-content';

  if (!isSelf) {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const author = document.createElement('span');
    author.className = 'msg-author';
    author.style.color = avatarColor(msg.uid);
    author.style.cursor = 'pointer';
    author.title = `私訊 ${msg.nick}`;
    author.textContent = msg.nick;
    author.addEventListener('click', () => openDM(msg.uid, msg.nick));
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = formatTime(msg.ts);
    meta.appendChild(author); meta.appendChild(time);
    content.appendChild(meta);
  } else {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = formatTime(msg.ts);
    meta.appendChild(time);
    content.appendChild(meta);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = msg.text;
  content.appendChild(bubble);
  div.appendChild(content);
  container.appendChild(div);

  if (!isSelf) sendNotif('💬 大廳', `${msg.nick}：${String(msg.text).slice(0,50)}`);
}

async function sendGlobal() {
  const input = document.getElementById('global-input');
  const text = input.value.trim();
  if (!text) return;
  remove(dbRef(db, 'global/typing/' + myUid));
  input.value = ''; autoResize(input);
  await push(dbRef(db, 'global/messages'), {
    uid: myUid, nick: myNick, text, ts: serverTimestamp()
  });
  // trim old messages
  const snap = await get(dbRef(db, 'global/messages'));
  if (snap.exists()) {
    const keys = Object.keys(snap.val());
    if (keys.length > MAX_GLOBAL_MSGS) {
      const upd = {};
      keys.slice(0, keys.length - MAX_GLOBAL_MSGS).forEach(k => upd['global/messages/' + k] = null);
      update(dbRef(db), upd);
    }
  }
}

    document.getElementById('mob-tab-dm')?.classList.add('active');
    mobCurrentTab = 'dm';
  }

  document.getElementById('dm-with-name').textContent = nick;
  document.getElementById('dm-messages').innerHTML = '';

  // Clear unread in conv list
  clearDMConvUnread(uid);

  const badge = document.getElementById('badge-' + uid);
  if (badge) { badge.textContent = ''; badge.classList.remove('show'); }
  document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.dm-conv-item').forEach(el => el.classList.remove('active'));

  const msgContainer = document.getElementById('dm-messages');

  dmUnsub = onChildAdded(q, snap => {

  });

  document.getElementById('dm-send').onclick = sendDM;
  document.getElementById('dm-input').onkeydown = e => { if (e.key === 'Enter') sendDM(); };

function renderDMMsg(msg, container) {
  const isSelf = msg.uid === myUid;
  const div = document.createElement('div');
  div.className = 'msg-row ' + (isSelf ? 'self' : 'other');
  const avatarHtml = isSelf ? '' : `<div class="msg-avatar" style="background:${avatarColor(msg.uid)}">${initials(msg.nick)}</div>`;
  const nameHtml = isSelf ? '' : `<span class="msg-author" style="color:${avatarColor(msg.uid)}">${escapeHtml(msg.nick)}</span>`;
  let bubbleHtml;
  if (msg.type === 'file') {
    bubbleHtml = `<div class="file-msg">
        <div class="file-icon">📄</div>
        <div class="file-info">
          <div class="file-name">${escapeHtml(msg.fileName)}</div>
          <span class="file-dl" style="cursor:pointer" onclick="trackDownloadAndOpen('${msg.url}', ${msg.fileSize || 0})">下載 ↓</span>
        </div>
      </div>`;
  } else {
    bubbleHtml = `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
  }
  div.innerHTML = `
    ${avatarHtml}
    <div class="msg-content">
      <div class="msg-meta">
        ${nameHtml}
        <span class="msg-time">${formatTime(msg.ts)}</span>
      </div>
      ${bubbleHtml}
    </div>
  `;
  container.appendChild(div);
  // 通知
  if (!isSelf) {
    const notifBody = msg.type === 'file' ? `傳送了檔案：${msg.fileName}` : String(msg.text).slice(0,50);
    sendNotif(`📩 私訊：${dmNick || ''}`, notifBody, true);  // isDM=true → 雙音 + 獨立通知
  }

  if (!isSelf && (!document.getElementById('panel-dm').classList.contains('open') || dmUid !== msg.uid)) {
    unreadDM[msg.uid] = (unreadDM[msg.uid] || 0) + 1;
    const badge = document.getElementById('badge-' + msg.uid);
    if (badge) { badge.textContent = unreadDM[msg.uid]; badge.classList.add('show'); }
  }

  // Update DM conversation list
  const previewText = msg.type === 'file' ? `📎 ${msg.fileName}` : msg.text;
  const msgColor = isSelf ? avatarColor(myUid) : avatarColor(msg.uid);
  const msgNick = isSelf ? myNick : msg.nick;
  updateDMConv(msg.uid === myUid ? dmUid : msg.uid,
               msg.uid === myUid ? dmNick : msg.nick,
               msgColor, previewText, !isSelf);

  // Wiggle conv list item if not currently open
  if (!isSelf) wiggleConvItem(msg.uid);

  // 檔案語音提示
  if (!isSelf && msg.type === 'file') {
    speakFileReceived();
  }
}

async function sendDM() {
  if (!dmRoomId) return;
  const input = document.getElementById('dm-input');
  const text = input.value.trim();
  const file = selectedFile;
  if (!text && !file) return;

  if (file) {
    await uploadAndSend(file);
    selectedFile = null;
    document.getElementById('file-preview-name').textContent = '';
    document.getElementById('dm-file-input').value = '';
  }
  if (text) {
    await push(dbRef(db, 'dms/' + dmRoomId + '/messages'), {
      uid: myUid, nick: myNick, text, ts: serverTimestamp()
    });
  }
}

function checkBeforeUpload() {
  if (isQuotaExceeded()) { toast('🔒 今日上傳已達上限'); return false; }
  if (!dmRoomId) { toast('⚠️ 請先點選對話對象再傳送檔案'); return false; }
  return true;  // 允許 label 打開 input
}

// ── 使用者選完檔案後觸發 ──
function onDriveFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  // 檔案大小限制：50MB
  if (file.size > 50 * 1024 * 1024) {
    toast('❌ 檔案太大，上限 50MB');
    return;
  }
  document.getElementById('file-preview-name').textContent = '📄 ' + file.name;
  uploadViaAppsScript(file);
}

// ── 上傳到 Apps Script ──
async function uploadViaAppsScript(file) {
  const btn = document.getElementById('dm-send');
  const progressBar = document.getElementById('upload-progress-bar');
  const fill = document.getElementById('upload-fill');
  btn.disabled = true;
  progressBar.style.display = 'block';
  fill.style.width = '10%';

  try {
    // 把檔案讀成 base64
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    fill.style.width = '40%';

    // 送給 Apps Script（redirect:follow 必要，Apps Script 會 302 redirect）
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'upload',
        fileName: `${Date.now()}_${file.name}`,
        fileData: base64,
        mimeType: file.type || 'application/octet-stream'
      })
    });

    fill.style.width = '80%';
    const result = await res.json();

    if (!result.ok) throw new Error(result.error || '上傳失敗');

    const { fileId, downloadUrl } = result;

    // 記錄到 Firebase DB（讓別人看得到這則訊息）
    await push(dbRef(db, 'dms/' + dmRoomId + '/messages'), {
      uid: myUid, nick: myNick,
      type: 'file',
      fileName: file.name,
      url: downloadUrl,
      fileId,
      fileSize: file.size,
      ts: serverTimestamp()
    });

    // 記錄 fileId 到 DB，凌晨清空時使用
    await push(dbRef(db, 'driveFiles/' + myUid), {
      fileId, ts: serverTimestamp()
    });

    await addUpload(file.size);
    fill.style.width = '100%';
    toast('✅ 檔案傳送成功！');
    document.getElementById('file-preview-name').textContent = '';

  } catch (err) {
    console.error('Upload error:', err);
    toast('❌ 上傳失敗：' + err.message);
    document.getElementById('file-preview-name').textContent = '';
  } finally {
    btn.disabled = false;
    setTimeout(() => {
      progressBar.style.display = 'none';
      fill.style.width = '0%';
    }, 800);
  }
}

//  CLOSE DM

document.getElementById('close-dm').addEventListener('click', () => {
  document.getElementById('panel-dm').classList.remove('open');
  document.getElementById('dm-list-panel').classList.remove('hide');
  // 手機版：停在右側面板顯示 dm list，不收起
  if (isMobile()) {
    document.getElementById('panel-right').classList.add('mob-show');
  }
  if (dmUnsub) { dmUnsub(); dmUnsub = null; }
  dmUid = null; dmNick = null; dmRoomId = null;
  renderDMConvList();
  document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
});

// ════════════════════════════════════════════════════
//  📱 MOBILE NAVIGATION
// ════════════════════════════════════════════════════
let mobCurrentTab = 'lobby';

function isMobile() { return window.innerWidth <= 768; }

function mobTab(tab) {
  if (!isMobile()) return;
  mobCurrentTab = tab;

  const left    = document.getElementById('panel-left');
  const right   = document.getElementById('panel-right');
  const overlay = document.getElementById('mob-overlay');

  left.classList.remove('mob-show');
  right.classList.remove('mob-show');
  overlay.classList.remove('show');

  ['lobby','users','dm'].forEach(t =>
    document.getElementById('mob-tab-' + t)?.classList.remove('active')
  );
  document.getElementById('mob-tab-' + tab)?.classList.add('active');

  if (tab === 'users') {
    left.classList.add('mob-show');
    overlay.classList.add('show');
    document.getElementById('mob-badge-users')?.classList.remove('show');
  } else if (tab === 'dm') {
    right.classList.add('mob-show');
    overlay.classList.add('show');
    document.getElementById('mob-badge-dm')?.classList.remove('show');
  }
}

// ── 綁定底部 tab 事件（用 touchend 最可靠，避免 300ms 延遲）──
function bindMobNav() {
  ['lobby','users','dm'].forEach(tab => {
    const btn = document.getElementById('mob-tab-' + tab);
    if (!btn) return;

    // touchend：手指離開時觸發（比 touchstart 更不容易誤觸）
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      e.stopPropagation();
      mobTab(tab);
    }, { passive: false });

    // click 作為 fallback（桌機或不支援 touch 的裝置）
    btn.addEventListener('click', (e) => {
      if (e.detail === 0) return; // 已被 touch 處理過
      mobTab(tab);
    });
  });

  // overlay 點擊收起
  const overlay = document.getElementById('mob-overlay');
  overlay.addEventListener('touchend', (e) => {
    e.preventDefault();
    mobTab('lobby');
  }, { passive: false });
  overlay.addEventListener('click', () => mobTab('lobby'));
}

// 有新私訊時顯示底部 tab badge
function updateMobDMBadge(totalUnread) {
  const badge = document.getElementById('mob-badge-dm');
  if (!badge) return;
  if (totalUnread > 0 && mobCurrentTab !== 'dm') {
    badge.textContent = totalUnread > 9 ? '9+' : totalUnread;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

// 頁面重新顯示時（從背景切回來）重新確認 presence

    const presR = dbRef(db, 'presence/' + myUid);
    set(presR, { nick: myNick, uid: myUid, color: avatarColor(myUid), ts: serverTimestamp() });
